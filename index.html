<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<title>ななはま鉄道 車内LCD</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050609;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;overflow:hidden}
:root{--line:#d000b3;--deep:#4d0044}
#viewport{position:fixed;inset:0;overflow:hidden;touch-action:none}
#lcd{position:absolute;width:1600px;height:1000px;transform-origin:0 0;background:#fff;overflow:hidden;color:#111}
.hero{height:310px;color:#fff;background:
 radial-gradient(ellipse at 64% 90%,var(--deep) 0%,rgba(0,0,0,0) 49%),
 linear-gradient(110deg,#07090c 0%,#111217 55%,#050608 100%);
 border-bottom:9px solid var(--line)}
.heroTop{height:142px;display:grid;grid-template-columns:350px 1fr 225px;align-items:stretch}
.serviceBox{margin:18px 0 0 20px;height:118px;border:3px solid #fff;border-radius:13px;background:linear-gradient(150deg,var(--line),var(--deep));display:flex;align-items:center;justify-content:center;font-size:76px;font-weight:900;letter-spacing:.03em;white-space:nowrap}
.destBlock{padding:25px 32px 0 40px;font-weight:900;white-space:nowrap;overflow:hidden}
.destLine{font-size:52px;line-height:1.15}.throughLine{font-size:32px;margin-top:12px}
.infoBox{margin:18px 20px 0 0;height:120px;border:3px solid #ddd;border-radius:12px;text-align:center;padding:7px 12px;background:linear-gradient(160deg,var(--deep),#08090b 66%)}
.carLine{height:59px;font-size:28px;font-weight:900;border-bottom:4px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px}.carLine b{font-size:67px;line-height:1}.timeLine{font-size:38px;padding-top:9px}
.nextRow{height:159px;display:grid;grid-template-columns:350px 150px 1fr;align-items:center;background:linear-gradient(100deg,#090a0d 0%,#111116 30%,var(--deep) 72%,var(--line) 130%)}
.nextLabel{font-size:56px;font-weight:900;text-align:center;white-space:nowrap}
.numbering{width:126px;height:126px;border:5px solid #111;border-radius:20px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:.82;box-shadow:0 0 0 3px #fff}
.numbering .pre{font-size:33px;color:var(--line);font-weight:900}.numbering .num{font-size:66px;color:#111;font-weight:900}
.nextStation{font-size:104px;font-weight:900;padding-left:30px;white-space:nowrap;overflow:hidden}
.routeArea{height:570px;background:#fff;padding:24px 28px 0;position:relative}
.stationGrid{height:490px;display:flex;position:relative;align-items:flex-start}
.rail{position:absolute;left:28px;right:28px;top:340px;height:74px;background:linear-gradient(90deg,var(--deep),var(--line) 30%,var(--line) 85%,var(--deep));z-index:0}
.rail:after{content:"";position:absolute;right:-31px;top:0;border-left:32px solid var(--deep);border-top:37px solid transparent;border-bottom:37px solid transparent}
.station{flex:1;min-width:0;text-align:center;position:relative;z-index:2}
.station.past{opacity:.30}.station.current{opacity:1}
.stationName{height:205px;margin:0 auto 3px;font-size:42px;font-weight:900;writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap;line-height:1.02}
.stationName.en{font-size:31px;text-orientation:sideways;letter-spacing:.02em}
.code{font-size:25px;font-weight:900;height:38px;white-space:nowrap}
.code .prefix{color:var(--line)}
.arrow{height:44px;position:relative;margin-top:2px}
.arrow:before{content:"";position:absolute;left:50%;top:15px;transform:translateX(-54px);width:70px;height:15px;background:#fff;border-radius:5px}
.arrow:after{content:"";position:absolute;left:50%;top:2px;transform:translateX(12px);border-left:34px solid #fff;border-top:22px solid transparent;border-bottom:22px solid transparent}
.station:not(.current) .arrow{visibility:hidden}
.timeNode{width:62px;height:62px;margin:2px auto 0;border:4px solid #111;border-radius:9px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-size:31px;font-weight:900;position:relative}
.station.current .timeNode{border:6px solid #fff;box-shadow:0 0 0 5px var(--line);font-size:29px}
.currentTxt{height:25px;color:#fff;font-size:18px;font-weight:900;margin-top:2px}
.legend{height:80px;border-top:1px solid #ddd;display:flex;align-items:center;justify-content:space-around;padding:0 45px;background:#fff;font-size:21px;font-weight:800}
.legendItem{display:flex;align-items:center;gap:11px;white-space:nowrap}.legendIcon{width:48px;height:48px;border-radius:7px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}
.controls{position:fixed;right:12px;bottom:12px;z-index:30;display:flex;gap:7px}.controls button{border:1px solid #777;border-radius:10px;background:rgba(5,7,10,.94);color:#fff;padding:10px 13px;font-weight:900}
</style></head><body>
<div id="viewport"><main id="lcd">
<section class="hero">
 <div class="heroTop">
  <div class="serviceBox" id="service"></div>
  <div class="destBlock"><div class="destLine" id="destination"></div><div class="throughLine" id="through"></div></div>
  <div class="infoBox"><div class="carLine"><b id="car"></b><span>号車</span></div><div class="timeLine" id="clock"></div></div>
 </div>
 <div class="nextRow"><div class="nextLabel" id="nextLabel"></div><div class="numbering"><span class="pre" id="prefix"></span><span class="num" id="number"></span></div><div class="nextStation" id="nextName"></div></div>
</section>
<section class="routeArea"><div class="stationGrid" id="stations"></div></section>
<div class="legend" id="legend"></div>
</main></div>
<div class="controls"><button id="rangeBtn">全停車駅</button><button id="langBtn">English</button><button id="fitBtn">全体表示</button><button id="settingsBtn">設定</button></div>
<script>
const $=id=>document.getElementById(id);let D=null,ja=true,compact=true,scale=1,px=0,py=0;
function hexDeep(hex){hex=(hex||"#d000b3").replace("#","");if(hex.length===3)hex=[...hex].map(x=>x+x).join("");let r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);return `rgb(${Math.round(r*.35)},${Math.round(g*.35)},${Math.round(b*.35)})`}
function sec(t){if(!t)return null;let a=String(t).split(":").map(Number);return a[0]*3600+a[1]*60+(a[2]||0)}
function fmt(s){s=(s+86400)%86400;return String(Math.floor(s/3600)).padStart(2,"0")+":"+String(Math.floor(s%3600/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function now(){let d=new Date();return d.getHours()*3600+d.getMinutes()*60+d.getSeconds()}
function schedule(){let r=D.route||[],stop=new Set(D.stopCodes||[]),a=r.findIndex(x=>x[2]===D.originCode),b=r.findIndex(x=>x[2]===D.destinationCode),t=sec(D.startTime),out=[];if(a<0||b<a||t===null)return D.schedule||[];for(let i=a;i<=b;i++){let s=r[i],st=stop.has(s[2])||i===a||i===b,ar=i===a?null:t,dp=i===a?t:(st&&i<b?t+(+s[4]||0):null);out.push({ja:s[0],en:s[1],code:s[2],stop:st,arrival:ar===null?null:fmt(ar),departure:dp===null?null:fmt(dp)});if(i<b){let leave=i===a?t:(st?(dp??t):t);t=leave+(+s[3]||0)}}return out}
function state(){let a=schedule(),n=now(),idx=0,phase="next";for(let i=0;i<a.length;i++){let ar=sec(a[i].arrival),dp=sec(a[i].departure);if(i===0&&dp!==null&&n<dp){idx=0;break}if(ar!==null&&n<ar){idx=i;break}if(ar!==null&&dp!==null&&n>=ar&&n<dp){idx=i;phase="now";break}idx=Math.min(i+1,a.length-1)}let s=a[idx],ar=sec(s?.arrival);if(phase!=="now"&&ar!==null&&ar>=n&&ar-n<=50)phase="soon";return{a,idx,s,phase}}
function render(){
 if(!D)return;let c=D.lineColor||"#d000b3";document.documentElement.style.setProperty("--line",c);document.documentElement.style.setProperty("--deep",hexDeep(c));
 let q=state(),s=q.s;if(!s)return;
 service.textContent=ja?(D.serviceJa||"快速"):(D.serviceEn||"Rapid");
 destination.textContent=ja?`${D.destinationJa||""} ゆき`:`Bound for ${D.destinationEn||""}`;
 through.textContent=ja?(D.throughJa||D.lineName||""):(D.throughEn||D.lineNameEn||"");
 car.textContent=D.car||"4";
 nextLabel.textContent=q.phase==="soon"?(ja?"まもなく":"Soon"):q.phase==="now"?(ja?"ただいま":"Now"):(ja?"つぎは":"Next");
 nextName.textContent=ja?s.ja:s.en;prefix.textContent=s.code.replace(/\d/g,"");number.textContent=(s.code.match(/\d+/)||[""])[0];
 let all=q.a.filter(x=>x.stop),ci=all.findIndex(x=>x.code===s.code),shown=all;
 if(compact){let start=Math.max(0,Math.min(ci-2,Math.max(0,all.length-5)));shown=all.slice(start,start+5)}
 let n=now();stations.innerHTML='<div class="rail"></div>'+shown.map(st=>{
   let gi=q.a.findIndex(x=>x.code===st.code),ar=sec(st.arrival),mins=ar===null?0:Math.max(0,Math.ceil((ar-n)/60)),past=gi<q.idx?"past":"",cur=st.code===s.code?"current":"";
   return `<div class="station ${past} ${cur}"><div class="stationName ${ja?"":"en"}">${ja?st.ja:st.en}</div><div class="code"><span class="prefix">${st.code.replace(/\d/g,"")}</span>${(st.code.match(/\d+/)||[""])[0]}</div><div class="arrow"></div><div class="timeNode">${mins}</div><div class="currentTxt">${cur?(ja?"現在地":"HERE"):""}</div></div>`
 }).join("");
 let legs=D.legend||[
  ["NV",D.lineName||"しょみん線"],["NZ","しょみん線各駅停車"],["SR","森林線"],["NR","東環状線"],["NI","みなと坂線"]
 ];
 legend.innerHTML=legs.map((x,i)=>`<div class="legendItem"><span class="legendIcon" style="background:${i===0?c:["#159f91","#12963c","#ef5b17","#28a8d6"][i-1]||c}">${x[0]}</span><span>${x[1]}</span></div>`).join("");
 langBtn.textContent=ja?"English":"日本語";rangeBtn.textContent=compact?"全停車駅":"5駅表示";
}
async function load(){try{let r=await fetch("/api/data");if(!r.ok)throw Error();D=await r.json()}catch(e){D=JSON.parse(localStorage.getItem("lcdBackup")||"null")}if(D){localStorage.setItem("lcdBackup",JSON.stringify(D));render()}}
function fit(){scale=Math.min(innerWidth/1600,innerHeight/1000);px=(innerWidth-1600*scale)/2;py=(innerHeight-1000*scale)/2;apply()}function apply(){lcd.style.transform=`translate(${px}px,${py}px) scale(${scale})`}
rangeBtn.onclick=()=>{compact=!compact;render()};langBtn.onclick=()=>{ja=!ja;render()};fitBtn.onclick=fit;settingsBtn.onclick=()=>location.href="/settings.html";
function tick(){let d=new Date();clock.textContent=d.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});render()}tick();setInterval(tick,1000);setInterval(()=>{ja=!ja;render()},30000);setInterval(()=>{compact=!compact;render()},15000);
let sd,ss,sx,sy,sm,drag=null;viewport.addEventListener("touchstart",e=>{let t=e.touches;if(t.length===2){sd=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);ss=scale;sx=px;sy=py;sm={x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2}}else if(t.length===1)drag={cx:t[0].clientX,cy:t[0].clientY,x:px,y:py}},{passive:false});
viewport.addEventListener("touchmove",e=>{e.preventDefault();let t=e.touches;if(t.length===2){let m={x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2},d=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY),ns=Math.max(.2,Math.min(4,ss*d/sd));px=m.x-(sm.x-sx)*ns/ss;py=m.y-(sm.y-sy)*ns/ss;scale=ns;apply()}else if(t.length===1&&drag){px=drag.x+t[0].clientX-drag.cx;py=drag.y+t[0].clientY-drag.cy;apply()}},{passive:false});
viewport.addEventListener("touchend",()=>drag=null);addEventListener("resize",fit);load();fit();
</script></body></html>
