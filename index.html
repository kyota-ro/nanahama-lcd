<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>Nanahama LCD</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#050505;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;color:#fff;overflow:hidden}body{touch-action:none}.viewport{position:fixed;inset:0;overflow:hidden;background:#050505}.stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:0 0;background:#fff;color:#111;box-shadow:0 0 0 2px #222;overflow:hidden;user-select:none}.top{height:285px;position:relative;background:linear-gradient(110deg,#111 0%,#090909 39%,#27051f 63%,#a9006e 100%);border-bottom:8px solid var(--line,#d500a9);color:white}.type{position:absolute;left:24px;top:20px;width:325px;height:122px;border:3px solid white;border-radius:13px;background:linear-gradient(135deg,var(--line,#d500a9),var(--dark,#650047));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:68px;line-height:1;white-space:nowrap}.sub{position:absolute;left:28px;top:154px;font-weight:800;font-size:29px}.nextlabel{position:absolute;left:84px;bottom:25px;font-weight:900;font-size:50px}.through{position:absolute;left:380px;top:31px;font-size:37px;font-weight:900;max-width:670px;white-space:nowrap;overflow:hidden}.dest{position:absolute;left:720px;top:28px;font-size:52px;font-weight:900;white-space:nowrap;max-width:610px;overflow:hidden}.nextbox{position:absolute;left:390px;bottom:17px;display:flex;align-items:center;gap:38px}.badge{width:134px;height:134px;border:4px solid #111;border-radius:20px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:.82;box-shadow:0 0 0 4px var(--line,#d500a9)}.badge .letters{color:var(--line,#d500a9);font-size:40px;font-weight:900}.badge .num{color:#111;font-size:62px;font-weight:900}.nextname{font-size:108px;font-weight:900;line-height:1;white-space:nowrap;max-width:650px;overflow:hidden}.car{position:absolute;right:28px;top:20px;width:190px;height:226px;border:3px solid white;border-radius:15px;background:linear-gradient(180deg,rgba(50,0,39,.8),#080808 72%);text-align:center}.car .carno{font-size:74px;font-weight:900;padding-top:16px}.car .unit{font-size:30px;margin-left:6px}.car .time{border-top:5px solid var(--line,#d500a9);margin:16px 15px 0;padding-top:15px;font-size:48px}.route{height:475px;background:#fff;position:relative;padding:25px 36px 0}.stations{height:100%;display:grid;grid-template-columns:repeat(9,1fr);gap:0;position:relative}.station{position:relative;text-align:center;min-width:0}.station.past{opacity:.28}.station .name{height:260px;display:flex;align-items:flex-end;justify-content:center;font-size:42px;font-weight:900;line-height:1.05;writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap;margin:auto}.station.en .name{font-size:31px;writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:0}.station .numbering{height:55px;display:flex;align-items:center;justify-content:center}.miniBadge{width:62px;height:52px;border:3px solid #111;border-radius:9px;background:white;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:.8}.miniBadge b{font-size:15px;color:var(--line);font-weight:900}.miniBadge strong{font-size:22px;color:#111;font-weight:900}.track{position:absolute;left:0;right:0;top:352px;height:78px;background:linear-gradient(90deg,var(--dark),var(--line) 35%,#ef00c3 65%,var(--dark));border-top:2px solid rgba(0,0,0,.15);border-bottom:2px solid rgba(0,0,0,.15)}.track:after{content:"";position:absolute;right:-28px;top:-2px;border-top:41px solid transparent;border-bottom:41px solid transparent;border-left:30px solid var(--dark)}.stopbox{position:absolute;top:360px;left:50%;transform:translateX(-50%);width:68px;height:62px;background:#fff;border:5px solid #222;border-radius:10px;z-index:2;display:flex;align-items:center;justify-content:center;font-size:31px;font-weight:900}.station.current .stopbox{border-color:#fff;box-shadow:0 0 0 5px var(--line)}.pointer{display:none;position:absolute;top:365px;left:calc(50% - 70px);width:0;height:0;border-top:28px solid transparent;border-bottom:28px solid transparent;border-left:45px solid #d7194b;z-index:5;filter:drop-shadow(0 1px 1px #555)}.station.current .pointer{display:block}.here{position:absolute;top:430px;left:0;right:0;font-size:20px;font-weight:900}.bottom{height:140px;background:#fff;border-top:1px solid #ddd;display:flex;align-items:center;justify-content:space-around;color:#111;padding:0 45px}.legend{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:800}.lg{width:49px;height:49px;border-radius:7px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}.controls{position:fixed;right:14px;bottom:14px;z-index:20;display:flex;gap:8px}.controls a,.controls button{border:1px solid #555;border-radius:12px;background:#151515;color:#fff;padding:10px 14px;font-size:14px;text-decoration:none}.lang-ind{position:fixed;left:12px;bottom:12px;color:#aaa;font-size:12px;z-index:10}@media(max-width:700px){.controls{opacity:.72}}
</style></head><body><div class="viewport" id="vp"><div class="stage" id="stage" style="--line:#d500a9;--dark:#59003f"><section class="top"><div class="type" id="type"></div><div class="sub" id="sub"></div><div class="nextlabel" id="nextLabel"></div><div class="through" id="through"></div><div class="dest" id="dest"></div><div class="nextbox"><div class="badge"><div class="letters" id="nextCode"></div><div class="num" id="nextNum"></div></div><div class="nextname" id="nextName"></div></div><div class="car"><div class="carno"><span id="carNo"></span><span class="unit" id="carUnit"></span></div><div class="time" id="clock"></div></div></section><section class="route"><div class="track"></div><div class="stations" id="stations"></div></section><section class="bottom" id="legend"></section></div></div><div class="lang-ind" id="langInd"></div><div class="controls"><button id="fit">全体表示</button><a href="settings.html">設定</a></div><script>
const DEFAULT={lineColor:'#d500a9',darkColor:'#59003f',lineNameJa:'しょみん線',lineNameEn:'Shomin Line',localTextJa:'しょみん線内 各駅停車',localTextEn:'Local on Shomin Line',typeJa:'快速',typeEn:'Rapid',throughJa:'みらいじま線直通',throughEn:'Through to Miraijima Line',destinationJa:'東ノ宮 ゆき',destinationEn:'Bound for Higashinomiya',carNo:'5',langSeconds:6,departure:'00:55:00',repeatDaily:true,stations:[['江川','Egawa','NV11',0,0],['しょみん','Shomin','NV12',2,30],['しょみん村','Shominmura','NV13',2,30],['船戸','Funato','NV14',2,30],['山神','Yamagami','NV15',2,30],['大吹','Obuki','NV16',3,30],['呼塚','Yobuzuka','NV17',3,30],['桜浜','Sakurahama','NV18',3,30],['新桜浜','Shin-Sakurahama','NV19',3,30],['武蔵多摩浜','Musashi-Tamahama','NV20',4,30],['州久内','Shukunai','NV21',3,30],['品山','Shinayama','NV22',3,30],['新端','Shinhata','NV23',3,30],['東ノ宮','Higashinomiya','NV24',4,0]].map(x=>({ja:x[0],en:x[1],code:x[2],runMin:x[3],dwellSec:x[4]})),legend:[['NV','しょみん線','#d500a9'],['NZ','しょみん線各駅停車','#18a6a1'],['SR','森林線','#16963a'],['NR','東環状線','#f15a19'],['NI','みなと坂線','#25a9d6']]};
let cfg={...DEFAULT,...JSON.parse(localStorage.getItem('nanahamaLCD')||'{}')}; if(!Array.isArray(cfg.stations)||cfg.stations.length<2)cfg.stations=DEFAULT.stations;
document.getElementById('stage').style.setProperty('--line',cfg.lineColor);document.getElementById('stage').style.setProperty('--dark',cfg.darkColor);
let forcedLang=null; function langNow(){if(forcedLang)return forcedLang;return Math.floor(Date.now()/((+cfg.langSeconds||6)*1000))%2?'en':'ja'}
function parseDeparture(){let [h,m,s]=cfg.departure.split(':').map(Number);let d=new Date();d.setHours(h||0,m||0,s||0,0);return d}
function timeline(){let dep=parseDeparture(), t=dep.getTime(), arr=[];cfg.stations.forEach((s,i)=>{if(i===0){arr.push({arr:t,dep:t+(s.dwellSec||0)*1000});t=arr[0].dep}else{t+=(s.runMin||0)*60000;let a=t;t+=(s.dwellSec||0)*1000;arr.push({arr:a,dep:t})}});return {dep,arr}}
function state(){let {dep,arr}=timeline(),now=Date.now(); if(now<arr[0].arr) return {idx:0,arr}; let idx=arr.length-1;for(let i=0;i<arr.length;i++){if(now<arr[i].dep){idx=i;break}if(i<arr.length-1&&now<arr[i+1].arr){idx=i;break}}return {idx,arr}}
function splitCode(c){let m=String(c).match(/^([A-Za-z]+)(\d+)$/);return m?[m[1],m[2]]:[c,'']}
function fitText(el,max,min=20){el.style.fontSize='';let size=parseFloat(getComputedStyle(el).fontSize);while((el.scrollWidth>el.clientWidth||el.scrollHeight>el.clientHeight)&&size>min){size-=2;el.style.fontSize=size+'px'}}
function render(){let L=langNow(),ja=L==='ja',st=state(),idx=st.idx, nextIdx=Math.min(idx+1,cfg.stations.length-1), next=cfg.stations[nextIdx], [nc,nn]=splitCode(next.code);type.textContent=ja?cfg.typeJa:cfg.typeEn;sub.textContent=ja?cfg.localTextJa:cfg.localTextEn;through.textContent=ja?cfg.throughJa:cfg.throughEn;dest.textContent=ja?cfg.destinationJa:cfg.destinationEn;nextLabel.textContent=ja?(Date.now()>=st.arr[nextIdx].arr-50000?'まもなく':'つぎは'):(Date.now()>=st.arr[nextIdx].arr-50000?'Soon':'Next');nextCode.textContent=nc;nextNum.textContent=nn;nextName.textContent=ja?next.ja:next.en;carNo.textContent=cfg.carNo;carUnit.textContent=ja?'号車':'Car';clock.textContent=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});langInd.textContent=ja?'日本語（自動切替）':'English (auto)';
let start=Math.max(0,idx-1),end=Math.min(cfg.stations.length,start+9);start=Math.max(0,end-9);let view=cfg.stations.slice(start,end);stations.innerHTML='';view.forEach((s,k)=>{let real=start+k,[c,n]=splitCode(s.code),mins=Math.max(0,Math.round((st.arr[real].arr-Date.now())/60000));if(real===idx)mins=0;let d=document.createElement('div');d.className='station '+(ja?'':'en')+(real<idx?' past':'')+(real===idx?' current':'');d.innerHTML=`<div class="name">${ja?s.ja:s.en}</div><div class="numbering"><div class="miniBadge"><b>${c}</b><strong>${n}</strong></div></div><div class="pointer"></div><div class="stopbox">${mins}</div>${real===idx?`<div class="here">${ja?'現在地':'HERE'}</div>`:''}`;stations.appendChild(d)});legend.innerHTML=(cfg.legend||DEFAULT.legend).map(x=>`<div class="legend"><span class="lg" style="background:${x[2]}">${x[0]}</span><span>${x[1]}</span></div>`).join('');fitText(type,32);fitText(through,24);fitText(dest,26);fitText(nextName,48)}
setInterval(render,500);render();
let vp=document.getElementById('vp'),stage=document.getElementById('stage'),scale=1,tx=0,ty=0,pointers=new Map(),startDist=0,startScale=1,startMid=null,startTx=0,startTy=0;function apply(){stage.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}function fit(){let w=innerWidth/1600,h=innerHeight/900;scale=Math.min(w,h);tx=(innerWidth-1600*scale)/2;ty=(innerHeight-900*scale)/2;apply()}fit();addEventListener('resize',fit);document.getElementById('fit').onclick=fit;
vp.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});vp.setPointerCapture(e.pointerId);if(pointers.size===1){startTx=tx;startTy=ty;startMid={x:e.clientX,y:e.clientY}}if(pointers.size===2){let a=[...pointers.values()];startDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);startScale=scale;startMid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};startTx=tx;startTy=ty}});vp.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});let a=[...pointers.values()];if(a.length===1){tx=startTx+(a[0].x-startMid.x);ty=startTy+(a[0].y-startMid.y)}else{let mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2},dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),ns=Math.max(.25,Math.min(3,startScale*dist/startDist));let contentX=(startMid.x-startTx)/startScale,contentY=(startMid.y-startTy)/startScale;scale=ns;tx=mid.x-contentX*scale;ty=mid.y-contentY*scale}apply()});['pointerup','pointercancel'].forEach(ev=>vp.addEventListener(ev,e=>pointers.delete(e.pointerId)));vp.addEventListener('wheel',e=>{e.preventDefault();let old=scale,ns=Math.max(.25,Math.min(3,scale*(e.deltaY<0?1.1:.9))),cx=(e.clientX-tx)/old,cy=(e.clientY-ty)/old;scale=ns;tx=e.clientX-cx*scale;ty=e.clientY-cy*scale;apply()},{passive:false});
</script></body></html>
