<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<title>ななはま鉄道 車内LCD</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#05070b;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;overflow:hidden}
#viewport{position:fixed;inset:0;overflow:hidden;touch-action:none}#lcd{position:absolute;width:1280px;height:720px;transform-origin:0 0;background:#f7f7f7;overflow:hidden}
.header{height:270px;color:#fff;background:linear-gradient(118deg,#070a11 0%,#151429 47%,#560048 100%);border-bottom:8px solid var(--line,#d000b3)}
.top{height:122px;display:grid;grid-template-columns:255px 1fr 145px;align-items:stretch}
.service{background:linear-gradient(135deg,var(--line,#e500c2),#8c005d);display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:900;line-height:1;white-space:nowrap}
.destination{padding:13px 28px;background:linear-gradient(105deg,rgba(255,255,255,.02),rgba(208,0,179,.14),rgba(255,255,255,.02));font-weight:900;overflow:hidden}
.destination .main{font-size:44px;white-space:nowrap}.destination .through{font-size:30px;margin-top:7px;white-space:nowrap}
.rightInfo{padding:12px 18px 8px;text-align:right}.car{font-size:18px}.car b{font-size:34px}.clock{font-size:31px;font-weight:900;margin-top:7px}
.next{height:140px;display:grid;grid-template-columns:200px 145px 1fr;align-items:center;padding:0 40px;background:linear-gradient(105deg,rgba(255,255,255,.01),rgba(208,0,179,.16),rgba(255,255,255,.02))}
.nextLabel{font-size:48px;font-weight:900;white-space:nowrap}.badge{width:108px;height:108px;border:7px solid #111;border-radius:20px;background:#fff;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:.87}.badge i{font-style:normal;color:var(--line,#d000b3);font-size:28px;font-weight:900}.badge b{font-size:52px}.nextName{font-size:78px;font-weight:900;white-space:nowrap}
.route{height:450px;padding:26px 28px 10px;background:#f7f7f7}.stations{height:385px;display:flex;position:relative;align-items:flex-start}.rail{position:absolute;left:52px;right:52px;top:240px;height:18px;background:var(--line,#c800ac);border-radius:10px}
.station{flex:1;min-width:0;text-align:center;position:relative;z-index:2;transition:opacity .2s}.station.past{opacity:.28}.station.current{opacity:1}
.stationName{height:128px;margin:0 auto 6px;font-size:31px;font-weight:900;writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap;line-height:1}.stationName.en{writing-mode:vertical-rl;text-orientation:sideways;white-space:nowrap;font-size:24px;letter-spacing:.02em}
.stationCode{display:inline-block;border:3px solid #111;border-radius:8px;background:#fff;padding:3px 8px;font-size:17px;font-weight:900;height:34px}.stationCode i{font-style:normal;color:var(--line,#c800ac)}
.node{width:34px;height:34px;background:#fff;border:7px solid var(--line,#c800ac);border-radius:6px;margin:13px auto 8px;position:relative}.station.current .node{width:44px;height:44px;margin-top:8px;box-shadow:0 0 0 7px color-mix(in srgb,var(--line,#d000b3) 15%,transparent)}
.travel{display:inline-flex;width:58px;height:48px;border:2px solid #222;border-radius:7px;background:#fff;align-items:center;justify-content:center;font-size:25px;font-weight:900}
.arrow{height:34px;margin:3px auto 0;position:relative;width:54px}.arrow::before{content:"";position:absolute;left:2px;top:12px;width:35px;height:10px;background:var(--line,#d000b3);border-radius:4px}.arrow::after{content:"";position:absolute;right:0;top:3px;border-left:22px solid var(--line,#d000b3);border-top:14px solid transparent;border-bottom:14px solid transparent}
.station:not(.current) .arrow{visibility:hidden}.controls{position:fixed;z-index:20;right:12px;bottom:12px;display:flex;gap:7px}.controls button{border:1px solid #777;border-radius:10px;background:rgba(10,14,20,.94);color:#fff;padding:10px 13px;font-weight:800}
</style></head><body><div id="viewport"><main id="lcd">
<header class="header"><div class="top"><div class="service" id="service"></div><div class="destination"><div class="main" id="destination"></div><div class="through" id="through"></div></div><div class="rightInfo"><div class="car"><b id="car"></b>号車</div><div class="clock" id="clock"></div></div></div>
<div class="next"><div class="nextLabel" id="nextLabel"></div><div class="badge"><i id="prefix"></i><b id="number"></b></div><div class="nextName" id="nextName"></div></div></header>
<section class="route"><div class="stations" id="stations"></div></section></main></div>
<div class="controls"><button id="rangeBtn">全停車駅</button><button id="langBtn">English</button><button id="fitBtn">全体表示</button><button id="settingsBtn">設定</button></div>
<script>
const $=x=>document.getElementById(x);let D,ja=true,compact=true,scale=1,px=0,py=0;
function hms(t){if(!t)return null;let a=String(t).split(":").map(Number);return a[0]*3600+a[1]*60+(a[2]||0)}
function fmt(s){s=(s+86400)%86400;return String(Math.floor(s/3600)).padStart(2,"0")+":"+String(Math.floor(s%3600/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function nowSec(){let d=new Date();return d.getHours()*3600+d.getMinutes()*60+d.getSeconds()}
function build(){let r=D.route||[],ss=new Set(D.stopCodes||[]),oi=r.findIndex(x=>x[2]===D.originCode),di=r.findIndex(x=>x[2]===D.destinationCode),t=hms(D.startTime),o=[];if(oi<0||di<oi||t===null)return D.schedule||[];for(let i=oi;i<=di;i++){let s=r[i],stop=ss.has(s[2])||i===oi||i===di,arr=i===oi?null:t,dep=i===oi?t:(stop&&i<di?t+(+s[4]||0):null);o.push({ja:s[0],en:s[1],code:s[2],stop,arrival:arr===null?null:fmt(arr),departure:dep===null?null:fmt(dep)});if(i<di){let leave=i===oi?t:(stop?(dep??t):t);t=leave+(+s[3]||0)}}return o}
function state(){let a=build(),n=nowSec(),idx=0,phase="next";for(let i=0;i<a.length;i++){let ar=hms(a[i].arrival),dp=hms(a[i].departure);if(i===0&&dp!==null&&n<dp){idx=0;break}if(ar!==null&&n<ar){idx=i;break}if(ar!==null&&dp!==null&&n>=ar&&n<dp){idx=i;phase="now";break}idx=Math.min(i+1,a.length-1)}let s=a[idx],ar=hms(s?.arrival);if(phase!=="now"&&ar!==null&&ar-n>=0&&ar-n<=50)phase="soon";return{a,idx,s,phase}}
function render(){if(!D)return;document.documentElement.style.setProperty("--line",D.lineColor||"#d000b3");let q=state(),n=q.s;if(!n)return;service.textContent=ja?D.serviceJa:D.serviceEn;destination.textContent=(ja?D.destinationJa:D.destinationEn)+(ja?" ゆき":"");through.textContent=ja?D.throughJa:D.throughEn;car.textContent=D.car||"";nextLabel.textContent=q.phase==="soon"?(ja?"まもなく":"Soon"):q.phase==="now"?(ja?"ただいま":"Now"):(ja?"つぎは":"Next");nextName.textContent=ja?n.ja:n.en;prefix.textContent=n.code.replace(/\d/g,"");number.textContent=(n.code.match(/\d+/)||[""])[0];
let stops=q.a.filter(x=>x.stop),currentStopIndex=stops.findIndex(x=>x.code===n.code),arr=stops;if(compact){let z=Math.max(0,Math.min(currentStopIndex-2,Math.max(0,stops.length-5)));arr=stops.slice(z,z+5)}
let now=nowSec();stations.innerHTML='<div class="rail"></div>'+arr.map(s=>{let global=q.a.findIndex(x=>x.code===s.code),ar=hms(s.arrival),mins=ar===null?0:Math.max(0,Math.ceil((ar-now)/60)),past=global<q.idx?"past":"",cur=s.code===n.code?"current":"";return `<div class="station ${past} ${cur}"><div class="stationName ${ja?"":"en"}">${ja?s.ja:s.en}</div><div class="stationCode"><i>${s.code.replace(/\d/g,"")}</i>${(s.code.match(/\d+/)||[""])[0]}</div><div class="node"></div><div class="travel">${mins}</div><div class="arrow"></div></div>`}).join("");langBtn.textContent=ja?"English":"日本語";rangeBtn.textContent=compact?"全停車駅":"5駅表示"}
async function load(){try{let r=await fetch("/api/data");if(!r.ok)throw Error();D=await r.json()}catch(e){D=JSON.parse(localStorage.getItem("lcdBackup")||"null")}if(D){localStorage.setItem("lcdBackup",JSON.stringify(D));render()}}
function fit(){scale=Math.min(innerWidth/1280,innerHeight/720);px=(innerWidth-1280*scale)/2;py=(innerHeight-720*scale)/2;tf()}function tf(){lcd.style.transform=`translate(${px}px,${py}px) scale(${scale})`}
rangeBtn.onclick=()=>{compact=!compact;render()};langBtn.onclick=()=>{ja=!ja;render()};fitBtn.onclick=fit;settingsBtn.onclick=()=>location.href="/settings.html";
function tick(){let d=new Date();clock.textContent=d.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});render()}tick();setInterval(tick,1000);setInterval(()=>{ja=!ja;render()},30000);setInterval(()=>{compact=!compact;render()},15000);
let sd,ss,sx,sy,sm,drag=null;viewport.addEventListener("touchstart",e=>{let t=e.touches;if(t.length===2){sd=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);ss=scale;sx=px;sy=py;sm={x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2}}else if(t.length===1)drag={cx:t[0].clientX,cy:t[0].clientY,x:px,y:py}},{passive:false});viewport.addEventListener("touchmove",e=>{e.preventDefault();let t=e.touches;if(t.length===2){let m={x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2},d=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY),ns=Math.max(.2,Math.min(4,ss*d/sd));px=m.x-(sm.x-sx)*ns/ss;py=m.y-(sm.y-sy)*ns/ss;scale=ns;tf()}else if(t.length===1&&drag){px=drag.x+t[0].clientX-drag.cx;py=drag.y+t[0].clientY-drag.cy;tf()}},{passive:false});viewport.addEventListener("touchend",()=>drag=null);addEventListener("resize",fit);load();fit();
</script></body></html>
