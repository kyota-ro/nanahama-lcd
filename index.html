<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>Nanahama LCD</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#050505;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;color:#fff;overflow:hidden}body{touch-action:none}.viewport{position:fixed;inset:0;overflow:hidden}.stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:0 0;background:#fff;color:#111;overflow:hidden;user-select:none}.top{height:285px;position:relative;background:linear-gradient(180deg,#090909 0%,#0d0b0d 43%,var(--dark,#59003f) 73%,var(--line,#d500a9) 100%);border-bottom:8px solid var(--line);color:#fff}.type{position:absolute;left:24px;top:20px;width:325px;height:122px;border:3px solid #fff;border-radius:13px;background:linear-gradient(180deg,var(--line),var(--dark));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:68px;line-height:1;white-space:nowrap}.sub{position:absolute;left:28px;top:154px;font-weight:800;font-size:29px;max-width:330px;white-space:nowrap}.nextlabel{position:absolute;left:84px;bottom:25px;font-weight:900;font-size:50px}.through,.dest{position:absolute;top:31px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:clip}.through{left:380px;width:430px;font-size:37px}.dest{left:820px;width:520px;font-size:46px}.nextbox{position:absolute;left:390px;bottom:17px;display:flex;align-items:center;gap:38px}.badge{width:134px;height:134px;border:4px solid #111;border-radius:20px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:.82}.badge .letters{color:var(--line);font-size:40px;font-weight:900}.badge .num{color:#111;font-size:62px;font-weight:900}.nextname{font-size:102px;font-weight:900;line-height:1;white-space:nowrap;width:760px;overflow:hidden}.car{position:absolute;right:28px;top:20px;width:190px;height:226px;border:3px solid #fff;border-radius:15px;background:#080808;text-align:center}.car .carno{font-size:74px;font-weight:900;padding-top:16px}.car .unit{font-size:30px;margin-left:6px}.car .time{border-top:5px solid var(--line);margin:16px 15px 0;padding-top:15px;font-size:48px}.route{height:475px;background:#fff;position:relative;padding:25px 36px 0}.stations{height:100%;display:grid;grid-template-columns:repeat(9,1fr);position:relative}.station{position:relative;text-align:center;min-width:0}.station.past{opacity:.28}.station .name{height:260px;display:flex;align-items:flex-end;justify-content:center;font-size:42px;font-weight:900;line-height:1.05;writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap;margin:auto;overflow:hidden}.station.en .name{font-size:28px;writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:-.5px;max-height:260px;overflow:hidden}.station .numbering{height:55px;display:flex;align-items:center;justify-content:center}.miniBadge{width:62px;height:52px;border:4px solid #111!important;border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:.8;box-shadow:none!important}.miniBadge b{font-size:15px;color:var(--line);font-weight:900}.miniBadge strong{font-size:22px;color:#111;font-weight:900}.track{position:absolute;left:0;right:0;top:352px;height:78px;background:linear-gradient(90deg,var(--dark),var(--line) 35%,#ef00c3 65%,var(--dark));border-top:2px solid rgba(0,0,0,.15);border-bottom:2px solid rgba(0,0,0,.15)}.track:after{content:"";position:absolute;right:-28px;top:-2px;border-top:41px solid transparent;border-bottom:41px solid transparent;border-left:30px solid var(--dark)}.stopbox{position:absolute;top:360px;left:50%;transform:translateX(-50%);width:68px;height:62px;background:#fff;border:5px solid #222;border-radius:10px;z-index:3;display:flex;align-items:center;justify-content:center;font-size:31px;font-weight:900}.station.current .stopbox{border-color:#fff;box-shadow:0 0 0 5px var(--line)}.pointer{display:none;position:absolute;top:365px;left:calc(50% - 76px);width:0;height:0;border-top:28px solid transparent;border-bottom:28px solid transparent;border-left:48px solid #d7194b;z-index:5}.station.current .pointer{display:block}.here{position:absolute;top:430px;left:0;right:0;font-size:20px;font-weight:900}.bottom{height:140px;background:#fff;border-top:1px solid #ddd;display:flex;align-items:center;justify-content:space-around;color:#111;padding:0 45px}.legend{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:800}.lg{width:49px;height:49px;border-radius:7px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}.controls{position:fixed;right:14px;bottom:14px;z-index:20;display:flex;gap:8px}.controls a,.controls button{border:1px solid #555;border-radius:12px;background:#151515;color:#fff;padding:10px 14px;font-size:14px;text-decoration:none}.lang-ind{position:fixed;left:12px;bottom:12px;color:#aaa;font-size:12px;z-index:10}
</style></head><body><div class="viewport" id="vp"><div class="stage" id="stage"><section class="top"><div class="type" id="type"></div><div class="sub" id="sub"></div><div class="nextlabel" id="nextLabel"></div><div class="through" id="through"></div><div class="dest" id="dest"></div><div class="nextbox"><div class="badge"><div class="letters" id="nextCode"></div><div class="num" id="nextNum"></div></div><div class="nextname" id="nextName"></div></div><div class="car"><div class="carno"><span id="carNo"></span><span class="unit" id="carUnit"></span></div><div class="time" id="clock"></div></div></section><section class="route"><div class="track"></div><div class="stations" id="stations"></div></section><section class="bottom" id="legend"></section></div></div><div class="lang-ind" id="langInd"></div><div class="controls"><button id="fit">全体表示</button><a href="settings.html">設定</a></div><script>
const BASELINES=[{id:'NV',nameJa:'しょみん線',nameEn:'Shomin Line',color:'#d500a9',dark:'#59003f'},{id:'NZ',nameJa:'しょみん線各駅停車',nameEn:'Local (Shomin Line)',color:'#18a6a1',dark:'#075e5b'},{id:'SR',nameJa:'森林線',nameEn:'Shinrin Line',color:'#16963a',dark:'#07541e'},{id:'NR',nameJa:'東環状線',nameEn:'Tokankyo Line',color:'#f15a19',dark:'#8a2600'},{id:'NI',nameJa:'みなと坂線',nameEn:'Minatozaka Line',color:'#25a9d6',dark:'#075a78'}];
const DEFAULT={activeLine:'NV',lines:BASELINES,lineNameJa:'しょみん線',lineNameEn:'Shomin Line',localTextJa:'しょみん線内 各駅停車',localTextEn:'Local on Shomin Line',typeJa:'快速',typeEn:'Rapid',throughJa:'みらいじま線直通',throughEn:'Through to Miraijima Line',destinationJa:'東ノ宮 ゆき',destinationEn:'Bound for Higashinomiya',carNo:'5',langSeconds:6,departure:'00:55:00',stations:[['江川','Egawa','NV11',0,0],['しょみん','Shomin','NV12',2,30],['しょみん村','Shominmura','NV13',2,30],['船戸','Funato','NV14',2,30],['山神','Yamagami','NV15',2,30],['大吹','Obuki','NV16',3,30],['呼塚','Yobuzuka','NV17',3,30],['桜浜','Sakurahama','NV18',3,30],['新桜浜','Shin-Sakurahama','NV19',3,30],['武蔵多摩浜','Musashi-Tamahama','NV20',4,30],['州久内','Shukunai','NV21',3,30],['品山','Shinayama','NV22',3,30],['新端','Shinhata','NV23',3,30],['東ノ宮','Higashinomiya','NV24',4,0]].map(x=>({ja:x[0],en:x[1],code:x[2],runMin:x[3],dwellSec:x[4]}))};
let cfg={...DEFAULT,...JSON.parse(localStorage.getItem('nanahamaLCD')||'{}')};if(!Array.isArray(cfg.lines))cfg.lines=BASELINES;if(!Array.isArray(cfg.stations)||cfg.stations.length<2)cfg.stations=DEFAULT.stations;function active(){return cfg.lines.find(x=>x.id===cfg.activeLine)||cfg.lines[0]||BASELINES[0]}function applyLine(){let l=active();stage.style.setProperty('--line',l.color);stage.style.setProperty('--dark',l.dark);cfg.lineNameJa=l.nameJa;cfg.lineNameEn=l.nameEn}applyLine();
function langNow(){return Math.floor(Date.now()/((+cfg.langSeconds||6)*1000))%2?'en':'ja'}function splitCode(c){let m=String(c).match(/^([A-Za-z]+)(.*)$/);return m?[m[1],m[2]]:['',c]}
function parseDeparture(){let a=cfg.departure.split(':').map(Number),d=new Date();d.setHours(a[0]||0,a[1]||0,a[2]||0,0);if(d.getTime()>Date.now()+12*3600000)d.setDate(d.getDate()-1);return d}function timeline(){let t=parseDeparture().getTime(),arr=[];cfg.stations.forEach((s,i)=>{if(i===0){arr.push({arr:t,dep:t+(s.dwellSec||0)*1000});t=arr[0].dep}else{t+=(s.runMin||0)*60000;let a=t;t+=(s.dwellSec||0)*1000;arr.push({arr:a,dep:t})}});return arr}function state(){let arr=timeline(),now=Date.now(),idx=0;for(let i=0;i<arr.length;i++){if(now>=arr[i].arr)idx=i;if(now<arr[i].arr)break}return{arr,idx}}
function shrink(el,min){let fs=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>el.clientWidth&&fs>min){fs-=1;el.style.fontSize=fs+'px'}}function shrinkHeight(el,min){let fs=parseFloat(getComputedStyle(el).fontSize);while(el.scrollHeight>el.clientHeight&&fs>min){fs-=1;el.style.fontSize=fs+'px'}}
function render(){applyLine();let ja=langNow()==='ja',st=state(),idx=st.idx,nextIdx=Math.min(idx+1,cfg.stations.length-1),next=cfg.stations[nextIdx],[nc,nn]=splitCode(next.code);type.textContent=ja?cfg.typeJa:cfg.typeEn;sub.textContent=ja?cfg.localTextJa:cfg.localTextEn;through.textContent=ja?cfg.throughJa:cfg.throughEn;dest.textContent=ja?cfg.destinationJa:cfg.destinationEn;nextLabel.textContent=ja?(Date.now()>=st.arr[nextIdx].arr-50000?'まもなく':'つぎは'):(Date.now()>=st.arr[nextIdx].arr-50000?'Soon':'Next');nextCode.textContent=nc;nextNum.textContent=nn;nextName.textContent=ja?next.ja:next.en;carNo.textContent=cfg.carNo;carUnit.textContent=ja?'号車':'Car';clock.textContent=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});langInd.textContent=ja?'日本語（自動）':'English (auto)';
let start=Math.max(0,idx-1),end=Math.min(cfg.stations.length,start+9);start=Math.max(0,end-9);stations.innerHTML='';cfg.stations.slice(start,end).forEach((s,k)=>{let real=start+k,[c,n]=splitCode(s.code),mins=Math.max(0,Math.round((st.arr[real].arr-Date.now())/60000));if(real===idx)mins=0;let d=document.createElement('div');d.className='station '+(ja?'':'en')+(real<idx?' past':'')+(real===idx?' current':'');d.innerHTML=`<div class="name">${ja?s.ja:s.en}</div><div class="numbering"><div class="miniBadge"><b>${c}</b><strong>${n}</strong></div></div><div class="pointer"></div><div class="stopbox">${mins}</div>${real===idx?`<div class="here">${ja?'現在地':'HERE'}</div>`:''}`;stations.appendChild(d);if(!ja)shrinkHeight(d.querySelector('.name'),19)});legend.innerHTML=cfg.lines.map(x=>`<div class="legend"><span class="lg" style="background:${x.color}">${x.id}</span><span>${ja?x.nameJa:x.nameEn}</span></div>`).join('');[through,dest,nextName,type].forEach((e,i)=>{e.style.fontSize='';shrink(e,[22,24,44,30][i])})}
setInterval(render,500);render();let scale=1,tx=0,ty=0,startDist=0,startScale=1,startX=0,startY=0,startTx=0,startTy=0;function fitStage(){scale=Math.min(innerWidth/1600,innerHeight/900);tx=(innerWidth-1600*scale)/2;ty=(innerHeight-900*scale)/2;draw()}function draw(){stage.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}fitStage();addEventListener('resize',fitStage);fit.onclick=fitStage;vp.addEventListener('touchstart',e=>{if(e.touches.length===2){startDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);startScale=scale}else if(e.touches.length===1){startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTx=tx;startTy=ty}},{passive:false});vp.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),ns=Math.max(.2,Math.min(4,startScale*d/startDist)),cx=(e.touches[0].clientX+e.touches[1].clientX)/2,cy=(e.touches[0].clientY+e.touches[1].clientY)/2;tx=cx-(cx-tx)*ns/scale;ty=cy-(cy-ty)*ns/scale;scale=ns;draw()}else if(e.touches.length===1){tx=startTx+e.touches[0].clientX-startX;ty=startTy+e.touches[0].clientY-startY;draw()}},{passive:false});
</script></body></html>
