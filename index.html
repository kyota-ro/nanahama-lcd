<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><title>ななはま鉄道LCD</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}:root{--c:#d00072;--d:#4b001f}

<script>
const $=x=>document.getElementById(x);let ja=true,compact=false,S=1,X=0,Y=0,D=null;
const F={lineColor:"#d00072",serviceJa:"快速",serviceEn:"Rapid",throughJa:"しょみん線直通",throughEn:"Through Shomin Line",destinationJa:"東ノ宮",destinationEn:"Higashinomiya",subJa:"しょみん線内 各駅停車",subEn:"Local on Shomin Line",car:"4",currentCode:"NV12",stations:[["江川","Egawa","NV11",-4],["大橋","Ohashi","NV13",-2],["しょみん","Shomin","NV12",0],["しょみん村","Shominmura","NV13",2],["船戸","Funato","NV14",5],["山神","Yamagami","NV15",7],["大吹","Obuki","NV16",10],["呼塚","Yobuzuka","NV17",12],["桜浜","Sakurahama","NV18",15],["新桜浜","Shin-Sakurahama","NV19",17],["武蔵多摩浜","Musashitamahama","NV20",21],["州久内","Shukunai","NV21",24],["品山","Shinayama","NV22",27],["新端","Niwa","NV23",30],["東ノ宮","Higashinomiya","NV24",33]]};
function dp(h){h=(h||"#d00072").replace("#","");let a=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16));return `rgb(${a.map(v=>Math.round(v*.34)).join(",")})`}
function render(){D=Object.assign({},F,D||{});let c=D.lineColor;document.documentElement.style.setProperty("--c",c);document.documentElement.style.setProperty("--d",dp(c));let a=D.stations||F.stations,ci=Math.max(0,a.findIndex(s=>s[2]===D.currentCode)),show=a;if(compact){let k=Math.max(0,Math.min(ci-2,a.length-5));show=a.slice(k,k+5)}type.textContent=ja?D.serviceJa:D.serviceEn;dest.textContent=ja?`${D.throughJa}　${D.destinationJa} ゆき`:`${D.throughEn}　Bound for ${D.destinationEn}`;sub.textContent=ja?D.subJa:D.subEn;nextword.textContent=ja?"つぎは":"Next";let cur=a[ci];next.textContent=ja?cur[0]:cur[1];nb1.textContent=cur[2].replace(/\d/g,"");nb2.textContent=(cur[2].match(/\d+/)||[""])[0];car.textContent=D.car||4;area.innerHTML='<div class="track"></div>'+show.map((s)=>{let i=a.indexOf(s),cl=(i<ci?"past ":"")+(i===ci?"cur":"");let m=Math.max(0,s[3]||0);return `<div class="st ${cl}"><div class="nm ${ja?"":"en"}">${ja?s[0]:s[1]}</div><div class="code"><i>${s[2].replace(/\d/g,"")}</i>${(s[2].match(/\d+/)||[""])[0]}</div><div class="arrow"></div><div class="node">${m}</div><div class="here">${ja?"（現在地）":"HERE"}</div></div>`}).join("");let L=[["NV","しょみん線",c],["NZ","しょみん線各駅停車","#159f91"],["SR","森林線","#15963b"],["NR","東環状線","#ef5b17"],["NI","みなと坂線","#29a8d6"]];legend.innerHTML=L.map(x=>`<div class="li"><span class="badge" style="background:${x[2]}">${x[0]}</span>${x[1]}</div>`).join("");mode.textContent=compact?"全停車駅":"5駅表示";lang.textContent=ja?"English":"日本語"}
async function load(){try{let r=await fetch("/api/data",{cache:"no-store"});if(r.ok)D=await r.json()}catch(e){}if(!D)try{D=JSON.parse(localStorage.getItem("lcdBackup"))}catch(e){}render()}

mode.onclick=()=>{compact=!compact;render()};lang.onclick=()=>{ja=!ja;render()};fit.onclick=fitall;setInterval(()=>{let d=new Date();clock.textContent=d.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})},1000);
let sd,ss,m0,x0,y0,drag;v.addEventListener("touchstart",e=>{let t=e.touches;if(t.length===2){sd=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);ss=S;x0=X;y0=Y;m0={x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2}}else if(t.length===1)drag={x:t[0].clientX,y:t[0].clientY,X,Y}},{passive:false});v.addEventListener("touchmove",e=>{e.preventDefault();let t=e.touches;if(t.length===2){let m={x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2},ns=Math.max(.2,Math.min(4,ss*Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)/sd));X=m.x-(m0.x-x0)*ns/ss;Y=m.y-(m0.y-y0)*ns/ss;S=ns;apply()}else if(t.length===1&&drag){X=drag.X+t[0].clientX-drag.x;Y=drag.Y+t[0].clientY-drag.y;apply()}},{passive:false});v.addEventListener("touchend",()=>drag=null);addEventListener("resize",fitall);load();fitall();
</script></body></html>
