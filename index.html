</style></head><body><div class="viewport" id="vp"><div class="stage" id="stage"><section class="top"><div class="type" id="type"></div><div class="sub" id="sub"></div><div class="nextlabel" id="nextLabel"></div><div class="through" id="through"></div><div class="dest" id="dest"></div><div class="nextbox"><div class="badge"><div class="letters" id="nextCode"></div><div class="num" id="nextNum"></div></div><div class="nextname" id="nextName"></div></div><div class="car"><div class="carno"><span id="carNo"></span><span class="unit" id="carUnit"></span></div><div class="time" id="clock"></div></div></section><section class="route"><div class="track"></div><div class="stations" id="stations"></div></section><section class="bottom" id="legend"></section></div></div><div class="lang-ind" id="langInd"></div><div class="controls"><button id="fit">全体表示</button><button id="settingsBtn">設定</button></div><div class="settingsPage" id="settingsPage"><div class="settingsHead"><button id="backBtn">← 表示へ戻る</button><h1>LCD 設定</h1></div><div class="settingsGrid"><section class="card"><h2>列車表示</h2><div class="field"><label>種別（日本語）</label><input id="sTypeJa"></div><div class="field"><label>種別（English）</label><input id="sTypeEn"></div><div class="field"><label>種別カラー</label><input id="sServiceColor" type="color"></div><div class="field"><label>直通先（日本語）</label><input id="sThroughJa"></div><div class="field"><label>直通先（English）</label><input id="sThroughEn"></div><div class="field"><label>行き先（日本語）</label><input id="sDestJa"></div><div class="field"><label>行き先（English）</label><input id="sDestEn"></div><div class="field"><label>号車</label><input id="sCar" inputmode="numeric"></div><div class="field"><label>日本語 / English 切替秒数</label><input id="sLang" type="number" min="1"></div><div class="field"><label>始発駅 発車時刻（HH:MM:SS）</label><input id="sDeparture" placeholder="00:55:00"><button type="button" id="setNow" style="margin-top:7px">現在時刻に設定</button></div></section><section class="card"><h2>路線</h2><div class="field"><label>編集する路線</label><select id="lineSelect"></select></div><div class="field"><label>LCD表示パターン</label><select id="patternSelect"></select></div><div class="settingsActions"><button id="addPattern">＋ 表示パターン追加</button><button id="deletePattern">このパターンを削除</button></div><div class="field"><label>路線記号</label><input id="lineId"></div><div class="field"><label>路線名（日本語）</label><input id="lineJa"></div><div class="field"><label>路線名（English）</label><input id="lineEn"></div><div class="field"><label>路線カラー</label><input id="lineColor" type="color"></div><div class="field"><label>濃い色（グラデーション用）</label><input id="lineDark" type="color"></div><div class="settingsActions"><button id="addLine">＋ 路線追加</button><button id="deleteLine">この路線を削除</button></div></section><section class="card" style="grid-column:1/-1"><h2>路線共通：駅間所要時間・停車時間</h2><div style="font-size:12px;color:#aaa;margin-bottom:8px">駅名 / English / ナンバリング / 前駅からの所要分 / 停車秒 / 乗り換え</div><div class="stationRows" id="stationRows"></div><div class="settingsActions"><button id="addStation">＋ 駅追加</button></div></section></div><div class="settingsActions"><button id="saveSettings">保存して表示へ</button><button id="resetSettings">初期設定に戻す</button></div><div class="saveNote" id="saveNote"></div></div><script>
const BASELINES=[{id:'NV',nameJa:'しょみん線',nameEn:'Shomin Line',color:'#d500a9',dark:'#59003f'},{id:'NZ',nameJa:'しょみん線各駅停車',nameEn:'Local (Shomin Line)',color:'#18a6a1',dark:'#075e5b'},{id:'SR',nameJa:'森林線',nameEn:'Shinrin Line',color:'#16963a',dark:'#07541e'},{id:'NR',nameJa:'東環状線',nameEn:'Tokankyo Line',color:'#f15a19',dark:'#8a2600'},{id:'NI',nameJa:'みなと坂線',nameEn:'Minatozaka Line',color:'#25a9d6',dark:'#075a78'}];
const DEFAULT_STATIONS=[['江川','Egawa','NV11',0,0],['しょみん','Shomin','NV12',2,30],['しょみん村','Shominmura','NV13',2,30],['船戸','Funato','NV14',2,30],['山神','Yamagami','NV15',2,30],['大吹','Obuki','NV16',3,30],['呼塚','Yobuzuka','NV17',3,30],['桜浜','Sakurahama','NV18',3,30],['新桜浜','Shin-Sakurahama','NV19',3,30],['武蔵多摩浜','Musashi-Tamahama','NV20',4,30],['州久内','Shukunai','NV21',3,30],['品山','Shinayama','NV22',3,30],['新端','Shinhata','NV23',3,30],['東ノ宮','Higashinomiya','NV24',4,0]].map(x=>({ja:x[0],en:x[1],code:x[2],runMin:x[3],dwellSec:x[4]}));
function newPattern(name='基本表示'){return{name,typeJa:'快速',typeEn:'Rapid',serviceColor:'#d500a9',throughJa:'みらいじま線直通',throughEn:'Through to Miraijima Line',destinationJa:'東ノ宮 ゆき',destinationEn:'Bound for Higashinomiya',carNo:'5',langSeconds:6,departure:'00:55:00'}}
const DEFAULT={activeLine:'NV',activePattern:0,lines:BASELINES.map((l,i)=>({...l,stations:structuredClone(DEFAULT_STATIONS).map(x=>({...x,transfers:[]})),patterns:[newPattern(i?'基本表示':'快速・東ノ宮')] }))};
let saved={};try{saved=JSON.parse(localStorage.getItem('nanahamaLCD')||'{}')}catch(e){}
let cfg=saved&&Array.isArray(saved.lines)?saved:structuredClone(DEFAULT);let editingLineIndex=0,editingPatternIndex=0;
// migrate older format without per-line patterns
if(!cfg.lines.length)cfg=structuredClone(DEFAULT);cfg.lines.forEach((l,i)=>{if(!Array.isArray(l.patterns)||!l.patterns.length){let p=newPattern();if(i===0){['typeJa','typeEn','serviceColor','throughJa','throughEn','destinationJa','destinationEn','carNo','langSeconds','departure'].forEach(k=>{if(saved[k]!=null)p[k]=structuredClone(saved[k])})}l.patterns=[p]}if(!Array.isArray(l.stations)||!l.stations.length){let oldPattern=l.patterns.find(q=>Array.isArray(q.stations)&&q.stations.length);let source=oldPattern?oldPattern.stations:null;if(!source&&i===0&&Array.isArray(saved.stations))source=saved.stations;l.stations=structuredClone(source||DEFAULT_STATIONS).map(x=>({...x,pass:x.pass===true,transfers:x.transfers||[]}))}l.patterns.forEach(q=>{if(!Array.isArray(q.stopCodes)||!q.stopCodes.length)q.stopCodes=l.stations.filter(s=>!s.pass).map(s=>s.code);if(!q.startCode)q.startCode=l.stations[0]?.code||'';if(!q.endCode){let dj=String(q.destinationJa||'').replace(/[ 　]*(ゆき|行き)$/,'').trim();q.endCode=(l.stations.find(s=>s.ja===dj)||l.stations[l.stations.length-1]||{}).code||''}delete q.stations})});if(cfg.activePattern==null)cfg.activePattern=0;
let cloudTimer=null;function saveCloud(){clearTimeout(cloudTimer);cloudTimer=setTimeout(async()=>{try{let r=await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg)});if(!r.ok)throw new Error('HTTP '+r.status);localStorage.setItem('nanahamaLCD',JSON.stringify(cfg))}catch(e){console.warn('cloud save failed',e)}},350)}
async function loadCloud(){try{let r=await fetch('/api/data',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let remote=await r.json();if(remote&&Array.isArray(remote.lines)&&remote.lines.length){cfg=remote;cfg.lines.forEach(l=>{l.patterns=l.patterns||[newPattern()];l.stations=l.stations||[];l.patterns.forEach(p=>{if(!Array.isArray(p.stopCodes)||!p.stopCodes.length)p.stopCodes=l.stations.filter(s=>!s.pass).map(s=>s.code);if(!p.startCode)p.startCode=l.stations[0]?.code||'';if(!p.endCode)p.endCode=l.stations[l.stations.length-1]?.code||''})});localStorage.setItem('nanahamaLCD',JSON.stringify(cfg));applyLine();render()}}catch(e){console.warn('cloud load failed; using local cache',e)}}

function active(){return cfg.lines.find(x=>x.id===cfg.activeLine)||cfg.lines[0]}
function pattern(){let l=active();cfg.activePattern=Math.max(0,Math.min(+cfg.activePattern||0,l.patterns.length-1));return l.patterns[cfg.activePattern]}
function darken(hex){hex=String(hex||'#777777').replace('#','');if(hex.length===3)hex=[...hex].map(x=>x+x).join('');let a=[0,2,4].map(i=>parseInt(hex.slice(i,i+2),16));return `rgb(${a.map(v=>Math.round(v*.38)).join(',')})`}function applyLine(){let l=active(),p=pattern();stage.style.setProperty('--line',l.color);stage.style.setProperty('--dark',l.dark);stage.style.setProperty('--service',p.serviceColor||l.color);stage.style.setProperty('--serviceDark',darken(p.serviceColor||l.color))}applyLine();
function screenMode(){let p=pattern(),n=Math.floor(Date.now()/((+p.langSeconds||6)*1000))%4;return{n,ja:n===0||n===2,full:n>=2}}function langNow(){return screenMode().ja?'ja':'en'}
function patternStops(p,route){if(Array.isArray(p.stopCodes)&&p.stopCodes.length)return new Set(p.stopCodes);return new Set(route.filter(s=>!s.pass).map(s=>s.code))}
function runBounds(p,route){let a=route.findIndex(s=>s.code===p.startCode),b=route.findIndex(s=>s.code===p.endCode);if(a<0)a=0;if(b<0){let dj=String(p.destinationJa||'').replace(/[ 　]*(ゆき|行き)$/,'').trim();b=route.findIndex(s=>s.ja===dj);if(b<0)b=route.length-1}if(a>b)[a,b]=[b,a];return[a,b]}
function splitCode(c){let m=String(c).match(/^([A-Za-z]+)(.*)$/);return m?[m[1],m[2]]:['',c]}
function parseDeparture(){let p=pattern(),a=p.departure.split(':').map(Number),d=new Date();d.setHours(a[0]||0,a[1]||0,a[2]||0,0);if(d.getTime()>Date.now()+12*3600000)d.setDate(d.getDate()-1);return d}
function timeline(){let route=active().stations||[],p=pattern(),stops=patternStops(p,route),[rs,re]=runBounds(p,route),t=parseDeparture().getTime(),arr=route.map(()=>({arr:Infinity,dep:Infinity}));for(let i=rs;i<=re;i++){let s=route[i],isStop=stops.has(s.code)||i===rs||i===re;if(i===rs){arr[i]={arr:t,dep:t+(isStop?(s.dwellSec||0):0)*1000};t=arr[i].dep}else{let prev=route[i-1];t+=(prev.runMin||0)*60000;let a=t;t+=(isStop?(s.dwellSec||0):0)*1000;arr[i]={arr:a,dep:t}}}return arr}
function state(){let route=active().stations||[],p=pattern(),arr=timeline(),[rs,re]=runBounds(p,route),now=Date.now(),idx=rs;for(let i=rs;i<=re;i++){if(now>=arr[i].arr)idx=i;if(now<arr[i].arr)break}return{arr,idx,rs,re}}
function shrink(el,min){let fs=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>el.clientWidth&&fs>min){fs-=1;el.style.fontSize=fs+'px'}}function shrinkHeight(el,min){let fs=parseFloat(getComputedStyle(el).fontSize);while(el.scrollHeight>el.clientHeight&&fs>min){fs-=1;el.style.fontSize=fs+'px'}}
function renderFull(route,p,mode,st){let stops=patternStops(p,route),[rs,re]=[st.rs,st.re],count=route.length;
let rowsCount=count<=22?1:2,per=Math.ceil(count/rowsCount);
routeEl=document.querySelector('.route');routeEl.classList.add('fullMode');stations.className='stations fullGrid';stations.innerHTML='';document.querySelectorAll('.screenTag').forEach(x=>x.remove());
for(let row=0;row<rowsCount;row++){let from=row*per,to=Math.min(count,from+per),part=route.slice(from,to),wrap=document.createElement('div');wrap.className='fullRow';wrap.style.gridTemplateColumns=`repeat(${part.length},minmax(0,1fr))`;
let segStart=Math.max(rs,from),segEnd=Math.min(re,to-1);
if(segStart<=segEnd){let line=document.createElement('div');line.className='fullRunLine';let cells=part.length;line.style.left=`${((segStart-from)+.5)/cells*100}%`;line.style.width=`${Math.max(0,(segEnd-segStart)/cells*100)}%`;wrap.appendChild(line)}
part.forEach((s,k)=>{let real=from+k,inRun=real>=rs&&real<=re,isStop=inRun&&(stops.has(s.code)||real===rs||real===re),pass=inRun&&!isStop,[c,n]=splitCode(s.code);
let mins=inRun&&Number.isFinite(st.arr[real].arr)?Math.max(0,Math.round((st.arr[real].arr-Date.now())/60000)):'';
let d=document.createElement('div');d.className=`fullStation ${mode.ja?'':'en'} ${inRun?'inRun':'outRun'} ${isStop?'trainStop':''} ${pass?'pass':''}`;
d.innerHTML=`<div class="fullName">${mode.ja?s.ja:s.en}</div><div class="fullBadge"><b>${c}</b><strong>${n}</strong></div><div class="fullTransfers">${(s.transfers||[]).map(t=>`<span class="transferBadge" style="background:${t.color||'#666'}">${t.code||''}</span>`).join('')}</div><div class="fullMark">${isStop?mins:''}</div>`;
wrap.appendChild(d);let nm=d.querySelector('.fullName');shrinkHeight(nm,mode.ja?11:9)});
stations.appendChild(wrap)}
let tag=document.createElement('div');tag.className='screenTag';tag.textContent=mode.ja?'全体表示':'Full line';document.querySelector('.route').appendChild(tag)}
function renderNear(route,p,mode,st){let stops=patternStops(p,route),visible=[];for(let i=Math.max(st.rs,st.idx-1);i<=st.re;i++){if(i===st.idx||stops.has(route[i].code)||i===st.re)visible.push(i);if(visible.length>=8)break}if(visible.length<8){for(let i=Math.max(st.rs,st.idx-2);i>=st.rs&&visible.length<8;i--){if(stops.has(route[i].code)&&!visible.includes(i))visible.unshift(i)}}document.querySelector('.route').classList.remove('fullMode');stations.className='stations';stations.style.gridTemplateColumns=`repeat(${Math.max(1,visible.length)},1fr)`;stations.innerHTML='';visible.forEach(real=>{let s=route[real],[c,n]=splitCode(s.code),mins=Math.max(0,Math.round((st.arr[real].arr-Date.now())/60000));if(real===st.idx)mins=0;let d=document.createElement('div');d.className='station '+(mode.ja?'':'en')+(real<st.idx?' past':'')+(real===st.idx?' current':'');d.innerHTML=`<div class="name">${mode.ja?s.ja:s.en}</div><div class="numbering"><div class="miniBadge"><b>${c}</b><strong>${n}</strong></div></div><div class="transfers">${(s.transfers||[]).map(t=>`<span class="transferBadge" style="background:${t.color||'#666'}">${t.code||t.name||''}</span>`).join('')}</div><div class="pointer"></div><div class="stopbox">${mins}</div>${real===st.idx?`<div class="here">${mode.ja?'現在地':'HERE'}</div>`:''}`;stations.appendChild(d);if(!mode.ja)shrinkHeight(d.querySelector('.name'),16)});document.querySelectorAll('.screenTag').forEach(x=>x.remove())}
function render(){applyLine();let p=pattern(),mode=screenMode(),ja=mode.ja,st=state(),idx=st.idx,route=active().stations||[],stops=patternStops(p,route),nextIdx=idx;for(let i=idx+1;i<=st.re;i++){if(stops.has(route[i].code)||i===st.re){nextIdx=i;break}}let next=route[nextIdx]||route[idx]||route[0],[nc,nn]=splitCode(next.code);type.textContent=ja?p.typeJa:p.typeEn;through.textContent=ja?p.throughJa:p.throughEn;dest.textContent=ja?p.destinationJa:p.destinationEn;nextLabel.textContent=ja?(Date.now()>=st.arr[nextIdx].arr-50000?'まもなく':'つぎは'):(Date.now()>=st.arr[nextIdx].arr-50000?'Soon':'Next');nextCode.textContent=nc;nextNum.textContent=nn;nextName.textContent=ja?next.ja:next.en;carNo.textContent=p.carNo;carUnit.textContent=ja?'号車':'Car';clock.textContent=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});langInd.textContent=mode.full?(ja?'全体・日本語':'Full · English'):(ja?'直近・日本語':'Nearby · English');if(mode.full)renderFull(route,p,mode,st);else renderNear(route,p,mode,st);legend.innerHTML=cfg.lines.map(x=>`<div class="legend"><span class="lg" style="background:${x.color}">${x.id}</span><span>${ja?x.nameJa:x.nameEn}</span></div>`).join('');[through,dest,nextName,type].forEach((e,i)=>{e.style.fontSize='';shrink(e,[18,34,44,30][i])})}
const controls=document.querySelector('.controls');function openSettings(){settingsPage.classList.add('open');controls.style.display='none';fillSettings()}function closeSettings(){commitPatternFields();commitCurrentLine();settingsPage.classList.remove('open');controls.style.display='flex';render()}
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('"','&quot;')}
function fillSettings(){lineSelect.innerHTML=cfg.lines.map((l,i)=>`<option value="${i}">${l.id}｜${l.nameJa}</option>`).join('');let ai=Math.max(0,cfg.lines.findIndex(l=>l.id===cfg.activeLine));lineSelect.value=ai;editingLineIndex=ai;fillLine(ai);fillPatternSelect();editingPatternIndex=cfg.activePattern;fillPatternFields()}
function fillLine(i){let l=cfg.lines[+i]||cfg.lines[0];if(!l)return;lineId.value=l.id||'';lineJa.value=l.nameJa||'';lineEn.value=l.nameEn||'';lineColor.value=l.color||'#777777';lineDark.value=l.dark||'#222222'}
function fillPatternSelect(){let l=active();patternSelect.innerHTML=l.patterns.map((p,i)=>`<option value="${i}">${esc(p.name||('表示 '+(i+1)))}</option>`).join('');patternSelect.value=cfg.activePattern}
function fillPatternFields(){let p=pattern();sTypeJa.value=p.typeJa||'';sTypeEn.value=p.typeEn||'';sServiceColor.value=p.serviceColor||active().color;sThroughJa.value=p.throughJa||'';sThroughEn.value=p.throughEn||'';sDestJa.value=p.destinationJa||'';sDestEn.value=p.destinationEn||'';sCar.value=p.carNo||'';sLang.value=p.langSeconds||6;sDeparture.value=p.departure||'';drawStationRows()}
function drawStationRows(){stationRows.innerHTML='';(active().stations||[]).forEach((s,i)=>{let r=document.createElement('div');r.className='stationRow';r.dataset.i=i;r.innerHTML=`<input class="rja" value="${esc(s.ja)}"><input class="ren" value="${esc(s.en)}"><input class="rcode" value="${esc(s.code)}"><input class="rrun" type="number" min="0" step="0.1" value="${s.runMin||0}"><input class="rdwell" type="number" min="0" value="${s.dwellSec||0}"><input class="rtransfer" value="${esc((s.transfers||[]).map(t=>[t.code,t.name,t.color].join('|')).join(';'))}" placeholder="NR|東環状線|#f15a19">`;stationRows.appendChild(r)})}
function readStations(){return[...stationRows.children].map(r=>({ja:r.querySelector('.rja').value,en:r.querySelector('.ren').value,code:r.querySelector('.rcode').value,runMin:+r.querySelector('.rrun').value||0,dwellSec:+r.querySelector('.rdwell').value||0,transfers:r.querySelector('.rtransfer').value.split(';').filter(Boolean).map(v=>{let a=v.split('|');return{code:a[0]||'',name:a[1]||'',color:a[2]||'#666666'}})}))}
function commitPatternFields(){let l=cfg.lines[editingLineIndex]||active(),p=l?.patterns?.[editingPatternIndex];if(!p)return;p.typeJa=sTypeJa.value;p.typeEn=sTypeEn.value;p.serviceColor=sServiceColor.value;p.throughJa=sThroughJa.value;p.throughEn=sThroughEn.value;p.destinationJa=sDestJa.value;p.destinationEn=sDestEn.value;p.carNo=sCar.value;p.langSeconds=Math.max(1,+sLang.value||6);p.departure=sDeparture.value||'00:00:00';l.stations=readStations()}
function commitCurrentLine(){let i=editingLineIndex,l=cfg.lines[i];if(!l)return;l.id=lineId.value.trim()||l.id;l.nameJa=lineJa.value.trim();l.nameEn=lineEn.value.trim();l.color=lineColor.value;l.dark=lineDark.value;cfg.activeLine=l.id;applyLine()}
// IMPORTANT: color inputs never rebuild settings DOM. This keeps iOS color picker open while dragging.
lineColor.addEventListener('input',()=>{let l=cfg.lines[editingLineIndex];if(l){l.color=lineColor.value;stage.style.setProperty('--line',l.color)}});lineDark.addEventListener('input',()=>{let l=cfg.lines[editingLineIndex];if(l){l.dark=lineDark.value;stage.style.setProperty('--dark',l.dark)}});sServiceColor.addEventListener('input',()=>{let l=cfg.lines[editingLineIndex],p=l?.patterns?.[editingPatternIndex];if(p){p.serviceColor=sServiceColor.value;stage.style.setProperty('--service',p.serviceColor);stage.style.setProperty('--serviceDark',darken(p.serviceColor))}});setNow.onclick=()=>{let d=new Date();sDeparture.value=[d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':');commitPatternFields();render()};
lineSelect.onchange=()=>{commitPatternFields();commitCurrentLine();editingLineIndex=+lineSelect.value;let l=cfg.lines[editingLineIndex];cfg.activeLine=l.id;cfg.activePattern=0;editingPatternIndex=0;fillLine(editingLineIndex);fillPatternSelect();fillPatternFields();applyLine();render()};

addPattern.onclick=()=>{commitPatternFields();let l=active(),n=newPattern('表示パターン '+(l.patterns.length+1));l.patterns.push(n);cfg.activePattern=l.patterns.length-1;editingPatternIndex=cfg.activePattern;fillPatternSelect();fillPatternFields();render()};deletePattern.onclick=()=>{let l=active();if(l.patterns.length<=1)return;l.patterns.splice(cfg.activePattern,1);cfg.activePattern=Math.max(0,cfg.activePattern-1);editingPatternIndex=cfg.activePattern;fillPatternSelect();fillPatternFields();render()};
addLine.onclick=()=>{commitPatternFields();commitCurrentLine();let n={id:'L'+(cfg.lines.length+1),nameJa:'新しい路線',nameEn:'New Line',color:'#777777',dark:'#222222',stations:[],patterns:[newPattern()]};cfg.lines.push(n);cfg.activeLine=n.id;cfg.activePattern=0;editingLineIndex=cfg.lines.length-1;editingPatternIndex=0;fillSettings();applyLine();render()};deleteLine.onclick=()=>{if(cfg.lines.length<=1)return;cfg.lines.splice(+lineSelect.value,1);cfg.activeLine=cfg.lines[0].id;cfg.activePattern=0;editingLineIndex=0;editingPatternIndex=0;fillSettings();applyLine();render()};addStation.onclick=()=>{let l=active();l.stations=readStations();l.stations.push({ja:'新駅',en:'New Station',code:(active()?.id||'NV')+'00',runMin:2,dwellSec:30,transfers:[]});drawStationRows()};
saveSettings.onclick=()=>{commitPatternFields();commitCurrentLine();localStorage.setItem('nanahamaLCD',JSON.stringify(cfg));saveCloud();saveNote.textContent='クラウドへ保存中…';closeSettings()};resetSettings.onclick=()=>{localStorage.removeItem('nanahamaLCD');cfg=structuredClone(DEFAULT);applyLine();fillSettings();saveNote.textContent='初期設定に戻しました'};settingsBtn.onclick=()=>location.href='settings.html';backBtn.onclick=closeSettings;
setInterval(()=>{if(!settingsPage.classList.contains('open'))render()},500);render();loadCloud();let scale=1,tx=0,ty=0,startDist=0,startScale=1,startX=0,startY=0,startTx=0,startTy=0;function fitStage(){scale=Math.min(innerWidth/1600,innerHeight/900);tx=(innerWidth-1600*scale)/2;ty=(innerHeight-900*scale)/2;draw()}function draw(){stage.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}fitStage();addEventListener('resize',fitStage);fit.onclick=fitStage;vp.addEventListener('touchstart',e=>{if(e.touches.length===2){startDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);startScale=scale}else if(e.touches.length===1){startX=e.touches[0].clientX;startY=e.touches[0].clientY;startTx=tx;startTy=ty}},{passive:false});vp.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),ns=Math.max(.2,Math.min(4,startScale*d/startDist)),cx=(e.touches[0].clientX+e.touches[1].clientX)/2,cy=(e.touches[0].clientY+e.touches[1].clientY)/2;tx=cx-(cx-tx)*ns/scale;ty=cy-(cy-ty)*ns/scale;scale=ns;draw()}else if(e.touches.length===1){tx=startTx+e.touches[0].clientX-startX;ty=startTy+e.touches[0].clientY-startY;draw()}},{passive:false});
