<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<title>ななはま鉄道 車内LCD</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#05070b;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;overflow:hidden}
#viewport{position:fixed;inset:0;overflow:hidden;touch-action:none}#lcd{position:absolute;width:1280px;height:720px;transform-origin:0 0;background:#f7f7f7;overflow:hidden}
.header{height:270px;color:#fff;background:linear-gradient(120deg,#080b13 0%,#151327 52%,#45003e 100%);border-bottom:8px solid #d000b3}
.row1{height:118px;display:grid;grid-template-columns:250px 1fr 205px 155px;align-items:stretch}
.service{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#e700c4,#ad006a);font-size:48px;font-weight:900}
.destination{padding:16px 25px}.destination .main{font-size:42px;font-weight:900}.destination .through{font-size:29px;font-weight:900;margin-top:5px}.car{margin:14px 7px;border:1px solid #aaa;border-radius:10px;text-align:center;padding-top:8px;font-size:18px}.car b{font-size:49px}.clock{display:grid;place-items:center;font-size:39px;font-weight:900}
.next{height:144px;display:grid;grid-template-columns:185px 145px 1fr;align-items:center;padding:0 38px}.nextLabel{font-size:36px;font-weight:900}
.badge{width:108px;height:108px;background:#fff;border:7px solid #111;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:.88;color:#111}.badge .prefix{font-size:28px;color:#d000b3;font-weight:900}.badge .number{font-size:52px;font-weight:900}
.nextName{font-size:76px;font-weight:900;letter-spacing:.02em}
.route{height:350px;padding:27px 25px 5px;background:#f6f6f6}.stations{height:238px;display:flex;position:relative;justify-content:space-around}.rail{position:absolute;left:43px;right:43px;top:82px;height:17px;background:#c900ad;border-radius:9px}
.station{flex:1;min-width:0;text-align:center;position:relative;z-index:2}.minutes{display:inline-flex;width:61px;height:55px;background:#fff;border:2px solid #222;border-radius:8px;align-items:center;justify-content:center;font-size:25px;font-weight:900}.minutes small{font-size:11px;line-height:1}
.node{width:32px;height:32px;background:#fff;border:7px solid #c900ad;border-radius:6px;margin:8px auto 5px}.station.current .node{width:45px;height:45px;margin-top:1px;box-shadow:0 0 0 7px rgba(208,0,179,.15)}
.stationName{font-size:28px;font-weight:900;writing-mode:vertical-rl;height:83px;margin:0 auto;line-height:1}.stationName.en{writing-mode:horizontal-tb;height:53px;font-size:21px;display:flex;justify-content:center;align-items:flex-start}
.stationCode{display:inline-block;border:3px solid #111;border-radius:8px;background:#fff;padding:2px 7px;font-size:16px;font-weight:900}.stationCode i{font-style:normal;color:#c900ad}
.transfers{height:68px;display:flex;align-items:center;justify-content:center;gap:25px;font-size:18px;font-weight:800}.transfer{padding:8px 14px;border-radius:7px;background:#e4e4e4}
.footer{height:100px;background:#090c12;color:#fff;display:grid;grid-template-columns:180px 1fr 230px;align-items:center;padding:0 32px}.footerTime{font-size:38px;font-weight:900}.message{text-align:center;font-size:24px;font-weight:800}.message strong{color:#ff2bd0}.date{text-align:right;font-size:18px}
.buttons{position:fixed;z-index:20;right:12px;bottom:12px;display:flex;gap:7px}.buttons button,.panel button{border:1px solid #777;border-radius:10px;background:rgba(10,14,20,.94);color:#fff;padding:10px 13px;font-weight:800}
.panel{position:fixed;display:none;z-index:30;right:12px;top:12px;width:min(410px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:#111821;color:#fff;border:1px solid #555;border-radius:14px;padding:15px}.panel.show{display:block}.panel h3{margin:0 0 10px}.panel label{display:block;color:#bbb;font-size:12px;margin:9px 0 3px}.panel input,.panel textarea{width:100%;border:1px solid #555;border-radius:7px;background:#080c11;color:#fff;padding:9px}.panel textarea{height:145px}.status{font-size:12px;margin:8px 0;color:#bbb}
</style></head><body>
<div id="viewport"><main id="lcd"><header class="header"><div class="row1"><div class="service" id="service"></div><div class="destination"><div class="main" id="destination"></div><div class="through" id="through"></div></div><div class="car"><b id="car"></b> 号車<br><span>Car No.</span></div><div class="clock" id="clock"></div></div><div class="next"><div class="nextLabel" id="nextLabel"></div><div class="badge"><span class="prefix" id="prefix"></span><span class="number" id="number"></span></div><div class="nextName" id="nextName"></div></div></header>
<section class="route"><div class="stations" id="stations"></div><div class="transfers" id="transfers"></div></section><footer class="footer"><div class="footerTime" id="footerTime"></div><div class="message" id="message"></div><div class="date" id="date"></div></footer></main></div>
<div class="buttons"><button id="rangeBtn">全停車駅</button><button id="langBtn">English</button><button id="fitBtn">全体表示</button><button id="settingsBtn">設定</button></div>
<div class="panel" id="panel"><h3>LCD設定</h3><div class="status" id="status">Neonから読み込みます</div>
<label>路線名 日本語</label><input id="lineJa"><label>路線名 English</label><input id="lineEn">
<label>種別 日本語</label><input id="serviceJa"><label>種別 English</label><input id="serviceEn">
<label>行き先 日本語</label><input id="destJa"><label>行き先 English</label><input id="destEn">
<label>直通先 日本語</label><input id="throughJa"><label>直通先 English</label><input id="throughEn">
<label>号車</label><input id="carInput"><label>現在/次駅の駅番号</label><input id="currentCode">
<label>停車駅：日本語|English|駅番号|あと何分</label><textarea id="stationInput"></textarea>
<label>乗換 日本語（・区切り）</label><input id="transferJa"><label>乗換 English（・区切り）</label><input id="transferEn">
<button id="saveBtn">Neonへ保存</button> <button id="closeBtn">閉じる</button></div>
<script>
const $=id=>document.getElementById(id);let D=null,ja=true,compact=true,scale=1,px=0,py=0;
const fallback={lineName:"しょみん線",lineNameEn:"Shomin Line",serviceJa:"快速",serviceEn:"Rapid",destinationJa:"東ノ宮",destinationEn:"Higashinomiya",throughJa:"みらいじま線直通",throughEn:"Through to Miraijima Line",car:"5",currentCode:"NV12",transfersJa:["森林線","東環状線"],transfersEn:["Shinrin Line","East Loop Line"],stations:[["江川","Egawa","NV11",2],["しょみん","Shomin","NV12",0],["しょみん村","Shominmura","NV13",2],["船戸","Funato","NV14",4],["山神","Yamagami","NV15",6],["大吹","Obuki","NV16",9],["呼塚","Yobuzuka","NV17",12],["桜浜","Sakurahama","NV18",15],["新桜浜","Shin-Sakurahama","NV19",18],["武蔵多摩浜","Musashi-Tamahama","NV20",22],["州久内","Shukunai","NV21",25],["品山","Shinayama","NV22",28],["新端","Shinhata","NV23",31],["東ノ宮","Higashinomiya","NV24",35]]};
function render(){if(!D)return;let k=D.stations.findIndex(s=>s[2]===D.currentCode);if(k<0)k=0;let n=D.stations[k];$("service").textContent=ja?D.serviceJa:D.serviceEn;$("destination").textContent=(ja?D.destinationJa:D.destinationEn)+(ja?" ゆき":"");$("through").textContent=ja?D.throughJa:D.throughEn;$("car").textContent=D.car;$("nextLabel").textContent=ja?"つぎは":"Next";$("nextName").textContent=ja?n[0]:n[1];$("prefix").textContent=n[2].replace(/\d/g,"");$("number").textContent=(n[2].match(/\d+/)||[""])[0];let arr=D.stations;if(compact){let start=Math.max(0,Math.min(k-2,D.stations.length-5));arr=D.stations.slice(start,start+5)}$("stations").innerHTML='<div class="rail"></div>'+arr.map(s=>`<div class="station ${s[2]===n[2]?"current":""}"><div class="minutes">${s[3]}<small>${ja?"分":"min"}</small></div><div class="node"></div><div class="stationName ${ja?"":"en"}">${ja?s[0]:s[1]}</div><div class="stationCode"><i>${s[2].replace(/\d/g,"")}</i>${(s[2].match(/\d+/)||[""])[0]}</div></div>`).join("");let tr=ja?D.transfersJa:D.transfersEn;$("transfers").innerHTML=tr.map(t=>`<span class="transfer">▣ ${t}</span>`).join("");$("message").innerHTML=ja?`<strong>まもなく</strong> ${n[0]}に到着します。`:`We will soon arrive at ${n[1]}.`;$("langBtn").textContent=ja?"English":"日本語";$("rangeBtn").textContent=compact?"全停車駅":"5駅表示"}
function fill(){lineJa.value=D.lineName;lineEn.value=D.lineNameEn;serviceJa.value=D.serviceJa;serviceEn.value=D.serviceEn;destJa.value=D.destinationJa;destEn.value=D.destinationEn;throughJa.value=D.throughJa;throughEn.value=D.throughEn;carInput.value=D.car;currentCode.value=D.currentCode;stationInput.value=D.stations.map(s=>s.join("|")).join("\n");transferJa.value=D.transfersJa.join("・");transferEn.value=D.transfersEn.join("・")}
async function load(){try{let r=await fetch("/api/data");if(!r.ok)throw Error();D=await r.json();status.textContent="Neonから読み込み済み"}catch(e){D=JSON.parse(localStorage.getItem("lcdBackup")||JSON.stringify(fallback));status.textContent="Neon読込失敗：端末内データを表示"}localStorage.setItem("lcdBackup",JSON.stringify(D));fill();render()}
async function save(){D={lineName:lineJa.value,lineNameEn:lineEn.value,serviceJa:serviceJa.value,serviceEn:serviceEn.value,destinationJa:destJa.value,destinationEn:destEn.value,throughJa:throughJa.value,throughEn:throughEn.value,car:carInput.value,currentCode:currentCode.value,stations:stationInput.value.trim().split("\n").map(x=>{let a=x.split("|");a[3]=+a[3];return a}),transfersJa:transferJa.value.split("・").filter(Boolean),transfersEn:transferEn.value.split("・").filter(Boolean)};render();localStorage.setItem("lcdBackup",JSON.stringify(D));status.textContent="保存中…";try{let r=await fetch("/api/data",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(D)});if(!r.ok)throw Error();status.textContent="Neonへ保存しました"}catch(e){status.textContent="Neon保存に失敗しました"}}
function fit(){scale=Math.min(innerWidth/1280,innerHeight/720);px=(innerWidth-1280*scale)/2;py=(innerHeight-720*scale)/2;transform()}function transform(){lcd.style.transform=`translate(${px}px,${py}px) scale(${scale})`}
rangeBtn.onclick=()=>{compact=!compact;render()};langBtn.onclick=()=>{ja=!ja;render()};fitBtn.onclick=fit;settingsBtn.onclick=()=>panel.classList.add("show");closeBtn.onclick=()=>panel.classList.remove("show");saveBtn.onclick=save;
function tick(){let d=new Date(),t=d.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});clock.textContent=t;footerTime.textContent=t;date.textContent=`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`}tick();setInterval(tick,1000);setInterval(()=>{ja=!ja;render()},30000);setInterval(()=>{compact=!compact;render()},15000);
let startDist,startScale,startX,startY,startMid,drag=null;viewport.addEventListener("touchstart",e=>{let t=e.touches;if(t.length===2){startDist=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);startScale=scale;startX=px;startY=py;startMid={x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2}}else if(t.length===1)drag={cx:t[0].clientX,cy:t[0].clientY,x:px,y:py}},{passive:false});viewport.addEventListener("touchmove",e=>{e.preventDefault();let t=e.touches;if(t.length===2){let m={x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2},dist=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY),ns=Math.max(.2,Math.min(4,startScale*dist/startDist));px=m.x-(startMid.x-startX)*ns/startScale;py=m.y-(startMid.y-startY)*ns/startScale;scale=ns;transform()}else if(t.length===1&&drag){px=drag.x+t[0].clientX-drag.cx;py=drag.y+t[0].clientY-drag.cy;transform()}},{passive:false});viewport.addEventListener("touchend",()=>drag=null);addEventListener("resize",fit);load();fit();
</script></body></html>
