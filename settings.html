<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LCD設定</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{max-width:1100px;margin:auto;padding:22px}h1{margin:0 0 18px}.card{background:#15191f;border:1px solid #303640;border-radius:14px;padding:18px;margin:14px 0}h2{margin:0 0 14px;font-size:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#bfc7d3}input{width:100%;background:#090b0e;color:#fff;border:1px solid #3b4350;border-radius:8px;padding:11px;font-size:16px}.station{display:grid;grid-template-columns:1.2fr 1.2fr .7fr .55fr .55fr 42px;gap:8px;margin:8px 0}.station button{background:#522;color:#fff;border:0;border-radius:8px}.actions{position:sticky;bottom:0;background:rgba(11,13,16,.94);padding:14px 0;display:flex;gap:10px}button,a.btn{border:0;border-radius:10px;padding:13px 18px;font-weight:800;font-size:15px;text-decoration:none}.save{background:#d500a9;color:#fff}.add{background:#2d3744;color:#fff}.btn{background:#fff;color:#111}.note{color:#aeb6c2;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}.station{grid-template-columns:1fr 1fr}.station>*:nth-child(n+3){min-width:0}}</style></head><body><div class="wrap"><h1>車内LCD 設定</h1><div class="card"><h2>列車・表示</h2><div class="grid" id="basic"></div></div><div class="card"><h2>駅間時分・停車時間</h2><p class="note">始発駅の発車時刻だけを設定し、2駅目以降は「前駅からの走行分数」と「停車秒数」から到着・発車時刻を自動計算します。</p><div id="stationList"></div><button class="add" id="add">＋ 駅を追加</button></div><div class="actions"><button class="save" id="save">設定を保存</button><a class="btn" href="index.html">LCDへ戻る</a><button class="add" id="reset">初期値</button></div></div><script>
const D={lineColor:'#d500a9',darkColor:'#59003f',lineNameJa:'しょみん線',lineNameEn:'Shomin Line',localTextJa:'しょみん線内 各駅停車',localTextEn:'Local on Shomin Line',typeJa:'快速',typeEn:'Rapid',throughJa:'みらいじま線直通',throughEn:'Through to Miraijima Line',destinationJa:'東ノ宮 ゆき',destinationEn:'Bound for Higashinomiya',carNo:'5',langSeconds:6,departure:'00:55:00',stations:[['江川','Egawa','NV11',0,0],['しょみん','Shomin','NV12',2,30],['しょみん村','Shominmura','NV13',2,30],['船戸','Funato','NV14',2,30],['山神','Yamagami','NV15',2,30],['大吹','Obuki','NV16',3,30],['呼塚','Yobuzuka','NV17',3,30],['桜浜','Sakurahama','NV18',3,30],['新桜浜','Shin-Sakurahama','NV19',3,30],['武蔵多摩浜','Musashi-Tamahama','NV20',4,30],['州久内','Shukunai','NV21',3,30],['品山','Shinayama','NV22',3,30],['新端','Shinhata','NV23',3,30],['東ノ宮','Higashinomiya','NV24',4,0]].map(x=>({ja:x[0],en:x[1],code:x[2],runMin:x[3],dwellSec:x[4]}))};let cfg={...D,...JSON.parse(localStorage.getItem('nanahamaLCD')||'{}')};if(!cfg.stations)cfg.stations=D.stations;
const fields=[['lineNameJa','路線名（日本語）'],['lineNameEn','路線名（英語）'],['typeJa','種別（日本語）'],['typeEn','種別（英語）'],['throughJa','直通先表示（日本語）'],['throughEn','直通先表示（英語）'],['destinationJa','行き先（日本語）'],['destinationEn','行き先（英語）'],['localTextJa','種別下表示（日本語）'],['localTextEn','種別下表示（英語）'],['carNo','号車'],['departure','始発駅 発車時刻'],['langSeconds','日英自動切替（秒）'],['lineColor','路線カラー'],['darkColor','グラデーション濃色']];basic.innerHTML=fields.map(([k,l])=>`<label>${l}<input data-k="${k}" value="${cfg[k]??''}" ${k.includes('Color')?'type="color"':''}></label>`).join('');
function draw(){stationList.innerHTML=cfg.stations.map((s,i)=>`<div class="station" data-i="${i}"><input data-f="ja" value="${s.ja}" placeholder="駅名"><input data-f="en" value="${s.en}" placeholder="English"><input data-f="code" value="${s.code}" placeholder="NV12"><input data-f="runMin" type="number" min="0" step="0.1" value="${s.runMin}" title="前駅からの走行分数"><input data-f="dwellSec" type="number" min="0" step="1" value="${s.dwellSec}" title="停車秒数"><button data-del="${i}">×</button></div>`).join('')}draw();
stationList.oninput=e=>{let row=e.target.closest('.station');if(!row)return;let i=+row.dataset.i,f=e.target.dataset.f;if(!f)return;cfg.stations[i][f]=['runMin','dwellSec'].includes(f)?+e.target.value:e.target.value};stationList.onclick=e=>{if(e.target.dataset.del!==undefined){cfg.stations.splice(+e.target.dataset.del,1);draw()}};add.onclick=()=>{cfg.stations.push({ja:'新駅',en:'New Station',code:'NV00',runMin:2,dwellSec:30});draw()};save.onclick=()=>{document.querySelectorAll('#basic input').forEach(x=>cfg[x.dataset.k]=['langSeconds'].includes(x.dataset.k)?+x.value:x.value);localStorage.setItem('nanahamaLCD',JSON.stringify(cfg));alert('保存しました。LCDに戻ると反映されます。')};reset.onclick=()=>{if(confirm('初期値に戻しますか？')){localStorage.removeItem('nanahamaLCD');location.reload()}};
</script></body></html>
