<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LCD設定</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1017;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.w{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none;background:#28313d;padding:10px 13px;border-radius:9px}.c{background:#151d28;border:1px solid #394454;border-radius:14px;padding:16px;margin:14px 0}label{display:block;color:#bbc3ce;font-size:13px;margin:10px 0 4px}input,textarea,select{width:100%;padding:10px;background:#080c12;color:#fff;border:1px solid #505b69;border-radius:8px;font-size:16px}textarea{height:210px}button{padding:12px 18px;background:#d000b3;color:#fff;border:0;border-radius:9px;font-weight:900}.note,#status{font-size:13px;color:#aeb6c1;line-height:1.6}.preview{white-space:pre-wrap;background:#080c12;padding:12px;border-radius:9px;font-family:ui-monospace,monospace;font-size:13px}</style></head><body><div class="w">
<div class="top"><h2>車内LCD 設定</h2><a href="/">LCDへ戻る</a></div><div id="status">読み込み中…</div>
<div class="c"><h3>① 路線・駅間設定</h3><p class="note">1行1駅：日本語|English|駅番号|次駅までの走行秒数|この駅の標準停車秒数<br>終点は「次駅まで」を0にします。</p>
<textarea id="route"></textarea></div>
<div class="c"><h3>② 種別・停車駅設定</h3><label>種別 日本語</label><input id="serviceJa"><label>種別 English</label><input id="serviceEn">
<label>停車する駅番号（カンマ区切り）</label><input id="stops"><p class="note">例：NV11,NV12,NV14,NV16,NV20,NV24。ここにない駅は通過として計算します。</p></div>
<div class="c"><h3>③ 運行する列車</h3><label>路線名 日本語</label><input id="lineName"><label>路線名 English</label><input id="lineNameEn"><label>路線カラー</label><input id="lineColor" type="color" value="#d000b3">
<label>始発駅番号</label><input id="originCode"><label>始発駅 発車時刻</label><input id="startTime" type="time" step="1">
<label>行き先駅番号</label><input id="destinationCode"><label>行き先表示 日本語</label><input id="destinationJa"><label>行き先表示 English</label><input id="destinationEn">
<label>直通先 日本語</label><input id="throughJa"><label>直通先 English</label><input id="throughEn"><label>号車</label><input id="car"></div>
<div class="c"><h3>自動計算プレビュー</h3><div class="preview" id="preview"></div></div>
<button id="save">Neonへ保存</button></div>
<script>
let D={};const $=x=>document.getElementById(x);
function parseRoute(){return route.value.trim().split("\n").filter(Boolean).map(x=>{let a=x.split("|");return [a[0],a[1],a[2],+(a[3]||0),+(a[4]||0)]})}
function hmsToSec(t){let a=(t||"00:00:00").split(":").map(Number);return a[0]*3600+a[1]*60+(a[2]||0)}
function fmt(s){s=(s+86400)%86400;return String(Math.floor(s/3600)).padStart(2,"0")+":"+String(Math.floor(s%3600/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function build(){let r=parseRoute(), stopSet=new Set(stops.value.split(",").map(x=>x.trim()).filter(Boolean)), oi=r.findIndex(x=>x[2]===originCode.value), di=r.findIndex(x=>x[2]===destinationCode.value);if(oi<0||di<oi)return[];let t=hmsToSec(startTime.value), out=[];for(let i=oi;i<=di;i++){let s=r[i],isStop=stopSet.has(s[2])||i===oi||i===di,arr=i===oi?null:t,dep=i===oi?t:(isStop&&i<di?t+s[4]:null);out.push({ja:s[0],en:s[1],code:s[2],stop:isStop,arrival:arr===null?null:fmt(arr),departure:dep===null?null:fmt(dep),arrivalSec:arr,departureSec:dep});if(i<di){let leave=i===oi?t:(isStop?(dep??t):t);t=leave+s[3]}}return out}
function show(){let a=build();preview.textContent=a.map(x=>`${x.code} ${x.ja}  ${x.stop?"停車":"通過"}  ${x.arrival?"着 "+x.arrival:""} ${x.departure?"発 "+x.departure:""}`).join("\n")||"始発駅・行き先駅を確認してください"}
["route","stops","originCode","destinationCode","startTime"].forEach(id=>$(id).addEventListener("input",show));
async function load(){try{let r=await fetch("/api/data");D=await r.json()}catch(e){D={}}let rr=D.route||D.stations?.map((s,i,a)=>[s[0],s[1],s[2],i<a.length-1?120:0,30])||[];route.value=rr.map(x=>x.join("|")).join("\n");serviceJa.value=D.serviceJa||"快速";serviceEn.value=D.serviceEn||"Rapid";stops.value=(D.stopCodes||rr.map(x=>x[2])).join(",");lineName.value=D.lineName||"しょみん線";lineNameEn.value=D.lineNameEn||"Shomin Line";lineColor.value=D.lineColor||"#d000b3";originCode.value=D.originCode||rr[0]?.[2]||"";startTime.value=D.startTime||"10:20:00";destinationCode.value=D.destinationCode||rr.at(-1)?.[2]||"";destinationJa.value=D.destinationJa||rr.at(-1)?.[0]||"";destinationEn.value=D.destinationEn||rr.at(-1)?.[1]||"";throughJa.value=D.throughJa||"";throughEn.value=D.throughEn||"";car.value=D.car||"5";show();status.textContent="Neonから読み込み済み"}
save.onclick=async()=>{D={...D,route:parseRoute(),serviceJa:serviceJa.value,serviceEn:serviceEn.value,stopCodes:stops.value.split(",").map(x=>x.trim()).filter(Boolean),lineName:lineName.value,lineNameEn:lineNameEn.value,lineColor:lineColor.value,originCode:originCode.value,startTime:startTime.value,destinationCode:destinationCode.value,destinationJa:destinationJa.value,destinationEn:destinationEn.value,throughJa:throughJa.value,throughEn:throughEn.value,car:car.value};D.schedule=build();status.textContent="保存中…";try{let r=await fetch("/api/data",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(D)});if(!r.ok)throw Error();localStorage.setItem("lcdBackup",JSON.stringify(D));status.textContent="Neonへ保存しました"}catch(e){status.textContent="保存に失敗しました"}};load();
</script></body></html>
