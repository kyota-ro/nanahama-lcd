<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nanahama LCD 設定</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
header{position:sticky;top:0;z-index:10;background:#101116;color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
header a{color:#fff;text-decoration:none;border:1px solid #666;border-radius:9px;padding:8px 12px}
main{max-width:900px;margin:auto;padding:16px}section{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 5px #0001}
h2{margin:0 0 14px}label{display:block;font-size:13px;font-weight:800;margin:11px 0 5px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid #bbb;border-radius:8px;background:#fff}
input[type=color]{height:54px;padding:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:9px;background:#17191f;color:#fff;padding:10px 14px;font-weight:800}button.danger{background:#9d2030}.stations{font-family:ui-monospace,monospace;min-height:210px}small{color:#666}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body><header><b>車内LCD 設定</b><a href="index.html">LCDへ戻る</a></header><main>
<section><h2>路線</h2><label>路線を選択</label><select id="lineSelect"></select><div class="buttons"><button id="addLine">路線追加</button><button class="danger" id="deleteLine">路線削除</button></div>
<div class="grid"><div><label>路線コード</label><input id="lineId"></div><div><label>日本語路線名</label><input id="lineJa"></div><div><label>English</label><input id="lineEn"></div><div><label>路線カラー</label><input id="lineColor" type="color"></div><div><label>グラデーション濃色</label><input id="lineDark" type="color"></div></div>
<small>カラーパッド操作中は画面を再描画しません。値の保存だけを行います。</small></section>
<section><h2>LCD表示パターン</h2><label>パターンを選択</label><select id="patternSelect"></select><div class="buttons"><button id="addPattern">パターン追加</button><button class="danger" id="deletePattern">パターン削除</button></div>
<div class="grid"><div><label>パターン名</label><input id="patternName"></div><div><label>号車</label><input id="carNo"></div><div><label>種別</label><input id="typeJa"></div><div><label>Type</label><input id="typeEn"></div><div><label>直通先</label><input id="throughJa"></div><div><label>Through service</label><input id="throughEn"></div><div><label>行先</label><input id="destinationJa"></div><div><label>Destination</label><input id="destinationEn"></div><div><label>補助表示</label><input id="localTextJa"></div><div><label>Sub text</label><input id="localTextEn"></div><div><label>始発発車時刻</label><input id="departure" type="time" step="1"></div><div><label>日英自動切替（秒）</label><input id="langSeconds" type="number" min="1"></div></div>
<label>駅設定</label><textarea id="stations" class="stations" spellcheck="false"></textarea><small>1行：日本語駅名|English|駅番号|次駅までの分|停車秒数</small></section>
<section><div class="buttons"><button id="save">保存してLCDへ反映</button></div><p id="status"></p></section>
</main><script>
const KEY="nanahamaLCD";
const BASELINES=[{id:'NV',nameJa:'しょみん線',nameEn:'Shomin Line',color:'#d500a9',dark:'#59003f'}];
let cfg;
function load(){
 try{cfg=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){cfg=null}
 if(!cfg)cfg={activeLine:'NV',lines:BASELINES,langSeconds:6,stations:[]};
 if(!Array.isArray(cfg.lines)||!cfg.lines.length)cfg.lines=BASELINES;
 // Normalize per-line patterns without destroying legacy settings.
 cfg.lines.forEach((l,i)=>{
   if(!Array.isArray(l.patterns)||!l.patterns.length){
     l.patterns=[{id:'p1',name:'基本表示',typeJa:cfg.typeJa||'快速',typeEn:cfg.typeEn||'Rapid',throughJa:cfg.throughJa||'',throughEn:cfg.throughEn||'',destinationJa:cfg.destinationJa||'',destinationEn:cfg.destinationEn||'',localTextJa:cfg.localTextJa||'',localTextEn:cfg.localTextEn||'',carNo:cfg.carNo||'1',departure:cfg.departure||'00:00:00',langSeconds:cfg.langSeconds||6,stations:cfg.stations||[]}];
   }
   if(!l.activePattern)l.activePattern=l.patterns[0].id;
 });
 if(!cfg.activeLine)cfg.activeLine=cfg.lines[0].id;
}
const $=id=>document.getElementById(id);
function line(){return cfg.lines.find(x=>x.id===cfg.activeLine)||cfg.lines[0]}
function pat(){let l=line();return l.patterns.find(x=>x.id===l.activePattern)||l.patterns[0]}
function persist(){localStorage.setItem(KEY,JSON.stringify(cfg))}
function drawLineSelect(){lineSelect.innerHTML=cfg.lines.map(l=>`<option value="${l.id}">${l.nameJa||l.id}</option>`).join('');lineSelect.value=line().id}
function drawPatternSelect(){let l=line();patternSelect.innerHTML=l.patterns.map(p=>`<option value="${p.id}">${p.name||p.id}</option>`).join('');patternSelect.value=pat().id}
function fill(){
 let l=line(),p=pat();lineId.value=l.id||'';lineJa.value=l.nameJa||'';lineEn.value=l.nameEn||'';lineColor.value=l.color||'#d500a9';lineDark.value=l.dark||'#59003f';
 patternName.value=p.name||'';carNo.value=p.carNo||'';typeJa.value=p.typeJa||'';typeEn.value=p.typeEn||'';throughJa.value=p.throughJa||'';throughEn.value=p.throughEn||'';destinationJa.value=p.destinationJa||'';destinationEn.value=p.destinationEn||'';localTextJa.value=p.localTextJa||'';localTextEn.value=p.localTextEn||'';departure.value=(p.departure||'00:00:00').slice(0,8);langSeconds.value=p.langSeconds||6;
 stations.value=(p.stations||[]).map(s=>[s.ja,s.en,s.code,s.runMin,s.dwellSec].join('|')).join('\n');
}
function drawAll(){drawLineSelect();drawPatternSelect();fill()}
function syncInputs(){
 let l=line(),p=pat(),old=l.id;
 l.id=lineId.value.trim()||old;l.nameJa=lineJa.value;l.nameEn=lineEn.value;l.color=lineColor.value;l.dark=lineDark.value;
 if(cfg.activeLine===old)cfg.activeLine=l.id;
 p.name=patternName.value;p.carNo=carNo.value;p.typeJa=typeJa.value;p.typeEn=typeEn.value;p.throughJa=throughJa.value;p.throughEn=throughEn.value;p.destinationJa=destinationJa.value;p.destinationEn=destinationEn.value;p.localTextJa=localTextJa.value;p.localTextEn=localTextEn.value;p.departure=departure.value;p.langSeconds=Math.max(1,+langSeconds.value||6);
 p.stations=stations.value.split(/\n/).filter(Boolean).map(r=>{let a=r.split('|');return {ja:a[0]||'',en:a[1]||'',code:a[2]||'',runMin:+a[3]||0,dwellSec:+a[4]||0}});
 // Mirror active pattern into legacy top-level fields so existing LCD v13 reads it immediately.
 Object.assign(cfg,{activeLine:l.id,typeJa:p.typeJa,typeEn:p.typeEn,throughJa:p.throughJa,throughEn:p.throughEn,destinationJa:p.destinationJa,destinationEn:p.destinationEn,localTextJa:p.localTextJa,localTextEn:p.localTextEn,carNo:p.carNo,departure:p.departure,langSeconds:p.langSeconds,stations:p.stations});
 persist();
}
lineSelect.onchange=()=>{syncInputs();cfg.activeLine=lineSelect.value;persist();drawPatternSelect();fill()};
patternSelect.onchange=()=>{syncInputs();line().activePattern=patternSelect.value;let p=pat();Object.assign(cfg,{typeJa:p.typeJa,typeEn:p.typeEn,throughJa:p.throughJa,throughEn:p.throughEn,destinationJa:p.destinationJa,destinationEn:p.destinationEn,localTextJa:p.localTextJa,localTextEn:p.localTextEn,carNo:p.carNo,departure:p.departure,langSeconds:p.langSeconds,stations:p.stations});persist();fill()};
addLine.onclick=()=>{syncInputs();let id='L'+Date.now().toString().slice(-6);cfg.lines.push({id,nameJa:'新しい路線',nameEn:'New Line',color:'#666666',dark:'#222222',activePattern:'p1',patterns:[{id:'p1',name:'基本表示',typeJa:'各駅停車',typeEn:'Local',throughJa:'',throughEn:'',destinationJa:'',destinationEn:'',localTextJa:'',localTextEn:'',carNo:'1',departure:'00:00:00',langSeconds:6,stations:[]}]});cfg.activeLine=id;persist();drawAll()};
deleteLine.onclick=()=>{if(cfg.lines.length<=1)return;cfg.lines=cfg.lines.filter(x=>x.id!==line().id);cfg.activeLine=cfg.lines[0].id;persist();drawAll()};
addPattern.onclick=()=>{syncInputs();let l=line(),id='p'+Date.now().toString().slice(-6),q=JSON.parse(JSON.stringify(pat()));q.id=id;q.name='新しい表示';l.patterns.push(q);l.activePattern=id;persist();drawPatternSelect();fill()};
deletePattern.onclick=()=>{let l=line();if(l.patterns.length<=1)return;l.patterns=l.patterns.filter(x=>x.id!==pat().id);l.activePattern=l.patterns[0].id;persist();drawPatternSelect();fill()};
// CRITICAL: input events never redraw DOM. This keeps iPhone keyboard and color picker open.
document.querySelectorAll('input,textarea').forEach(el=>el.addEventListener('input',()=>{syncInputs();status.textContent='保存済み'}));
save.onclick=()=>{syncInputs();status.textContent='LCDへ反映しました'};
load();drawAll();
</script></body></html>
