<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LCD設定</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;padding:14px}header{position:sticky;top:0;background:#0b0b0d;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:8px 0 14px}a,button{background:#202126;color:#fff;border:1px solid #555;border-radius:10px;padding:10px 14px;text-decoration:none;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;max-width:1100px}.card{border:1px solid #3a3a40;border-radius:14px;padding:14px;background:#141418}.field{display:flex;flex-direction:column;gap:5px;margin:9px 0}.field label{font-size:13px;color:#bbb}.field input,.field select{width:100%;background:#08080a;color:#fff;border:1px solid #555;border-radius:8px;padding:10px;font-size:16px}.stationRow{display:grid;grid-template-columns:1fr 1.1fr .65fr .55fr .55fr 1.4fr;gap:6px;margin:7px 0}.stationRow input{min-width:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}input[type=color]{height:52px;padding:4px}@media(max-width:700px){.stationRow{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}</style></head><body>
<header><h1>LCD 設定</h1><a href="index.html">LCDへ戻る</a></header><div class="grid">
<section class="card"><h2>路線・表示パターン</h2><div class="field"><label>路線</label><select id="lineSelect"></select></div><div class="actions"><button id="addLine">＋路線追加</button><button id="deleteLine">路線削除</button></div><div class="field"><label>表示パターン</label><select id="patternSelect"></select></div><div class="actions"><button id="addPattern">＋パターン追加</button><button id="deletePattern">パターン削除</button></div><div class="field"><label>パターン名</label><input id="patternName"></div><div class="field"><label>路線記号</label><input id="lineId"></div><div class="field"><label>路線名</label><input id="lineJa"></div><div class="field"><label>Line name</label><input id="lineEn"></div><div class="field"><label>路線カラー</label><input id="lineColor" type="color"></div><div class="field"><label>濃色</label><input id="lineDark" type="color"></div></section>
<section class="card"><h2>列車表示</h2><div class="field"><label>種別</label><input id="typeJa"></div><div class="field"><label>Type</label><input id="typeEn"></div><div class="field"><label>種別カラー</label><input id="serviceColor" type="color"></div><div class="field"><label>直通表示</label><input id="throughJa"></div><div class="field"><label>Through</label><input id="throughEn"></div><div class="field"><label>行き先</label><input id="destJa"></div><div class="field"><label>Destination</label><input id="destEn"></div><div class="field"><label>号車</label><input id="car"></div><div class="field"><label>日英切替（秒）</label><input id="lang" type="number" min="1"></div><div class="field"><label>始発駅発車時刻</label><input id="departure" placeholder="HH:MM:SS"><button id="setNow" type="button">現在時刻に設定</button></div></section>
<section class="card" style="grid-column:1/-1"><h2>路線共通：駅一覧</h2><div style="margin-bottom:8px;color:#bbb">駅名・英語名・駅番号・停車秒数・乗換を登録します。</div><div>駅名 / English / 番号 / 停車秒 / 乗換（例 NR|東環状線|#f15a19）</div><div id="rows"></div><div class="actions"><button id="addStation">＋駅追加</button></div></section>
<section class="card" style="grid-column:1/-1"><h2>路線共通：駅間所要時間</h2><div style="margin-bottom:8px;color:#bbb">駅一覧を登録すると、隣り合う駅の組み合わせが自動で表示されます。所要時間は路線単位で保存され、同一路線の全パターンで共通です。</div><div id="segmentRows"></div></section></div><div class="actions"><button id="save">保存</button><span id="note"></span></div>
<script>
const KEY='nanahamaLCD'; const $=id=>document.getElementById(id); let cfg,li=0,pi=0;
function basePattern(){return{name:'基本表示',typeJa:'快速',typeEn:'Rapid',serviceColor:'#d500a9',throughJa:'みらいじま線直通',throughEn:'Through to Miraijima Line',destinationJa:'東ノ宮 ゆき',destinationEn:'Bound for Higashinomiya',carNo:'5',langSeconds:6,departure:'00:55:00'}}
function load(){try{cfg=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){};if(!cfg||!Array.isArray(cfg.lines)||!cfg.lines.length)cfg={activeLine:'NV',activePattern:0,lines:[{id:'NV',nameJa:'しょみん線',nameEn:'Shomin Line',color:'#d500a9',dark:'#59003f',patterns:[basePattern()]}]};cfg.lines.forEach(l=>{if(!l.patterns?.length)l.patterns=[basePattern()];if(!Array.isArray(l.stations)||!l.stations.length){let old=l.patterns.find(q=>Array.isArray(q.stations)&&q.stations.length);l.stations=structuredClone(old?old.stations:[]).map(s=>({...s,transfers:s.transfers||[]}))}l.patterns.forEach(q=>{if(!q.serviceColor)q.serviceColor=l.color;delete q.stations})});li=Math.max(0,cfg.lines.findIndex(l=>l.id===cfg.activeLine));pi=Math.max(0,Math.min(cfg.activePattern||0,cfg.lines[li].patterns.length-1))}
function L(){return cfg.lines[li]} function P(){return L().patterns[pi]} function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('"','&quot;')}
function persist(){cfg.activeLine=L().id;cfg.activePattern=pi;localStorage.setItem(KEY,JSON.stringify(cfg));note.textContent='保存済み'}
function drawSelectors(){lineSelect.innerHTML=cfg.lines.map((l,i)=>`<option value="${i}">${l.id}｜${l.nameJa}</option>`).join('');lineSelect.value=li;patternSelect.innerHTML=L().patterns.map((p,i)=>`<option value="${i}">${p.name||'表示 '+(i+1)}</option>`).join('');patternSelect.value=pi}
function fill(){let l=L(),p=P();patternName.value=p.name||'';lineId.value=l.id||'';lineJa.value=l.nameJa||'';lineEn.value=l.nameEn||'';lineColor.value=l.color||'#777777';lineDark.value=l.dark||'#222222';typeJa.value=p.typeJa||'';typeEn.value=p.typeEn||'';serviceColor.value=p.serviceColor||l.color;throughJa.value=p.throughJa||'';throughEn.value=p.throughEn||'';destJa.value=p.destinationJa||'';destEn.value=p.destinationEn||'';car.value=p.carNo||'';lang.value=p.langSeconds||6;departure.value=p.departure||'';drawRows()}
function drawRows(){rows.innerHTML='';(L().stations||[]).forEach((s,i)=>{let r=document.createElement('div');r.className='stationRow';r.dataset.runMin=String(s.runMin||0);r.innerHTML=`<input class="ja" value="${esc(s.ja)}"><input class="en" value="${esc(s.en)}"><input class="code" value="${esc(s.code)}"><input class="dwell" type="number" min="0" value="${s.dwellSec||0}"><input class="tr" value="${esc((s.transfers||[]).map(t=>[t.code,t.name,t.color].join('|')).join(';'))}">`;rows.appendChild(r)});drawSegments()}
function drawSegments(){segmentRows.innerHTML='';let rr=[...rows.children];for(let i=0;i<rr.length-1;i++){let a=rr[i],b=rr[i+1],d=document.createElement('div');d.className='segmentRow';d.innerHTML=`<div class="segmentName">${esc(a.querySelector('.ja').value||('駅'+(i+1)))} <span style="color:#888">→</span> ${esc(b.querySelector('.ja').value||('駅'+(i+2)))}</div><input class="segmentMin" type="number" step="0.1" min="0" inputmode="decimal" value="${a.dataset.runMin||0}"><div>分</div>`;d.querySelector('.segmentMin').addEventListener('input',e=>{a.dataset.runMin=e.target.value;commit()});segmentRows.appendChild(d)}}
function commit(){let l=L(),p=P(),old=l.id;l.id=lineId.value.trim()||old;l.nameJa=lineJa.value;l.nameEn=lineEn.value;l.color=lineColor.value;l.dark=lineDark.value;p.name=patternName.value;p.typeJa=typeJa.value;p.typeEn=typeEn.value;p.serviceColor=serviceColor.value;p.throughJa=throughJa.value;p.throughEn=throughEn.value;p.destinationJa=destJa.value;p.destinationEn=destEn.value;p.carNo=car.value;p.langSeconds=Math.max(1,+lang.value||6);p.departure=departure.value||'00:00:00';l.stations=[...rows.children].map(r=>({ja:r.querySelector('.ja').value,en:r.querySelector('.en').value,code:r.querySelector('.code').value,runMin:+r.dataset.runMin||0,dwellSec:+r.querySelector('.dwell').value||0,transfers:r.querySelector('.tr').value.split(';').filter(Boolean).map(v=>{let a=v.split('|');return{code:a[0]||'',name:a[1]||'',color:a[2]||'#666666'}})}));cfg.activeLine=l.id;persist()}
// No DOM redraw on input: iPhone keyboard/color picker stays open.
document.addEventListener('input',e=>{if(e.target.matches('input'))commit()});
lineSelect.onchange=()=>{commit();li=+lineSelect.value;pi=0;cfg.activeLine=L().id;cfg.activePattern=0;persist();drawSelectors();fill()};patternSelect.onchange=()=>{commit();pi=+patternSelect.value;cfg.activePattern=pi;persist();fill()};
addLine.onclick=()=>{commit();cfg.lines.push({id:'L'+(cfg.lines.length+1),nameJa:'新しい路線',nameEn:'New Line',color:'#777777',dark:'#222222',stations:[],patterns:[basePattern()]});li=cfg.lines.length-1;pi=0;persist();drawSelectors();fill()};deleteLine.onclick=()=>{if(cfg.lines.length<=1)return;cfg.lines.splice(li,1);li=0;pi=0;persist();drawSelectors();fill()};addPattern.onclick=()=>{commit();let p=structuredClone(P());p.name='表示パターン '+(L().patterns.length+1);L().patterns.push(p);pi=L().patterns.length-1;persist();drawSelectors();fill()};deletePattern.onclick=()=>{if(L().patterns.length<=1)return;L().patterns.splice(pi,1);pi=0;persist();drawSelectors();fill()};rows.addEventListener('change',e=>{if(e.target.classList.contains('ja'))drawSegments()});
addStation.onclick=()=>{commit();L().stations.push({ja:'新駅',en:'New Station',code:L().id+'00',runMin:2,dwellSec:30,transfers:[]});persist();drawRows()};setNow.onclick=()=>{let d=new Date();departure.value=[d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':');commit()};save.onclick=commit;
load();drawSelectors();fill();
</script></body></html>
