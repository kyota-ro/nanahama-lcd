<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LCD設定</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.wrap{max-width:1150px;margin:auto;padding:22px}.card{background:#15191f;border:1px solid #303640;border-radius:14px;padding:18px;margin:14px 0}h1,h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#bfc7d3}input,select{width:100%;background:#090b0e;color:#fff;border:1px solid #3b4350;border-radius:8px;padding:11px;font-size:16px}.routeRow{display:grid;grid-template-columns:90px 1fr 1fr 90px 90px 44px;gap:8px;margin:8px 0;align-items:center}.station{display:grid;grid-template-columns:1.2fr 1.2fr .7fr .55fr .55fr 42px;gap:8px;margin:8px 0}.del{background:#522;color:#fff;border:0;border-radius:8px}.actions{position:sticky;bottom:0;background:rgba(11,13,16,.94);padding:14px 0;display:flex;gap:10px}button,a.btn{border:0;border-radius:10px;padding:13px 18px;font-weight:800;font-size:15px;text-decoration:none}.save{background:#d500a9;color:#fff}.add{background:#2d3744;color:#fff}.btn{background:#fff;color:#111}.selected{border:2px solid #d500a9;padding:12px;border-radius:12px;margin-top:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.routeRow,.station{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><h1>車内LCD 設定</h1><div class="card"><h2>路線設定</h2><label>編集する路線<select id="routeSelect"></select></label><div id="routes"></div><button class="add" id="addRoute">＋ 路線を追加</button><div class="selected"><div class="grid" id="routeEdit"></div></div></div><div class="card"><h2>列車・表示</h2><div class="grid" id="basic"></div></div><div class="card"><h2>駅・時刻設定</h2><div id="stationList"></div><button class="add" id="addStation">＋ 駅を追加</button></div><div class="actions"><button class="save" id="save">設定を保存</button><a class="btn" href="index.html">LCDへ戻る</a><button class="add" id="reset">初期値</button></div></div><script>
const BASE=[{id:'NV',nameJa:'しょみん線',nameEn:'Shomin Line',color:'#d500a9',dark:'#59003f'},{id:'NZ',nameJa:'しょみん線各駅停車',nameEn:'Local (Shomin Line)',color:'#18a6a1',dark:'#075e5b'},{id:'SR',nameJa:'森林線',nameEn:'Shinrin Line',color:'#16963a',dark:'#07541e'},{id:'NR',nameJa:'東環状線',nameEn:'Tokankyo Line',color:'#f15a19',dark:'#8a2600'},{id:'NI',nameJa:'みなと坂線',nameEn:'Minatozaka Line',color:'#25a9d6',dark:'#075a78'}];const D={activeLine:'NV',lines:BASE,typeJa:'快速',typeEn:'Rapid',throughJa:'みらいじま線直通',throughEn:'Through to Miraijima Line',destinationJa:'東ノ宮 ゆき',destinationEn:'Bound for Higashinomiya',localTextJa:'しょみん線内 各駅停車',localTextEn:'Local on Shomin Line',carNo:'5',departure:'00:55:00',langSeconds:6,stations:[['江川','Egawa','NV11',0,0],['しょみん','Shomin','NV12',2,30],['しょみん村','Shominmura','NV13',2,30],['船戸','Funato','NV14',2,30],['山神','Yamagami','NV15',2,30],['大吹','Obuki','NV16',3,30],['呼塚','Yobuzuka','NV17',3,30],['桜浜','Sakurahama','NV18',3,30],['新桜浜','Shin-Sakurahama','NV19',3,30],['武蔵多摩浜','Musashi-Tamahama','NV20',4,30],['州久内','Shukunai','NV21',3,30],['品山','Shinayama','NV22',3,30],['新端','Shinhata','NV23',3,30],['東ノ宮','Higashinomiya','NV24',4,0]].map(x=>({ja:x[0],en:x[1],code:x[2],runMin:x[3],dwellSec:x[4]}))};let cfg={...D,...JSON.parse(localStorage.getItem('nanahamaLCD')||'{}')};if(!Array.isArray(cfg.lines))cfg.lines=BASE;if(!Array.isArray(cfg.stations))cfg.stations=D.stations;
const fields=[['typeJa','種別（日本語）'],['typeEn','種別（英語）'],['throughJa','直通先（日本語）'],['throughEn','直通先（英語）'],['destinationJa','行き先（日本語）'],['destinationEn','行き先（英語）'],['localTextJa','種別下（日本語）'],['localTextEn','種別下（英語）'],['carNo','号車'],['departure','始発駅 発車時刻'],['langSeconds','日英自動切替（秒）']];basic.innerHTML=fields.map(([k,l])=>`<label>${l}<input data-k="${k}" value="${cfg[k]??''}"></label>`).join('');function routesDraw(){routeSelect.innerHTML=cfg.lines.map(x=>`<option value="${x.id}" ${x.id===cfg.activeLine?'selected':''}>${x.id}｜${x.nameJa}</option>`).join('');routes.innerHTML=cfg.lines.map((x,i)=>`<div class="routeRow"><b>${x.id}</b><span>${x.nameJa}</span><span>${x.nameEn}</span><span style="height:30px;background:${x.color};border-radius:6px"></span><span style="height:30px;background:${x.dark};border-radius:6px"></span><button class="del" data-rdel="${i}">×</button></div>`).join('');editDraw()}function editDraw(){let r=cfg.lines.find(x=>x.id===cfg.activeLine)||cfg.lines[0];routeEdit.innerHTML=[['id','路線コード'],['nameJa','路線名（日本語）'],['nameEn','路線名（英語）'],['color','メインカラー'],['dark','濃色']].map(([k,l])=>`<label>${l}<input data-rf="${k}" value="${r[k]}" ${['color','dark'].includes(k)?'type="color"':''}></label>`).join('')}routesDraw();routeSelect.onchange=()=>{cfg.activeLine=routeSelect.value;editDraw()};routeEdit.oninput=e=>{let r=cfg.lines.find(x=>x.id===cfg.activeLine);if(!r)return;const f=e.target.dataset.rf;if(!f)return;r[f]=e.target.value;if(f==='id')cfg.activeLine=e.target.value};routeEdit.onchange=e=>{routesDraw()};routes.onclick=e=>{if(e.target.dataset.rdel!==undefined&&cfg.lines.length>1){cfg.lines.splice(+e.target.dataset.rdel,1);if(!cfg.lines.some(x=>x.id===cfg.activeLine))cfg.activeLine=cfg.lines[0].id;routesDraw()}};addRoute.onclick=()=>{let n=cfg.lines.length+1,id='L'+n;cfg.lines.push({id,nameJa:'新路線',nameEn:'New Line',color:'#777777',dark:'#333333'});cfg.activeLine=id;routesDraw()};function stationsDraw(){stationList.innerHTML=cfg.stations.map((s,i)=>`<div class="station" data-i="${i}"><input data-f="ja" value="${s.ja}"><input data-f="en" value="${s.en}"><input data-f="code" value="${s.code}"><input data-f="runMin" type="number" step=".1" value="${s.runMin}"><input data-f="dwellSec" type="number" value="${s.dwellSec}"><button class="del" data-sdel="${i}">×</button></div>`).join('')}stationsDraw();stationList.oninput=e=>{let row=e.target.closest('.station');if(!row)return;let f=e.target.dataset.f;if(f)cfg.stations[+row.dataset.i][f]=['runMin','dwellSec'].includes(f)?+e.target.value:e.target.value};stationList.onclick=e=>{if(e.target.dataset.sdel!==undefined){cfg.stations.splice(+e.target.dataset.sdel,1);stationsDraw()}};addStation.onclick=()=>{cfg.stations.push({ja:'新駅',en:'New Station',code:cfg.activeLine+'00',runMin:2,dwellSec:30});stationsDraw()};save.onclick=()=>{document.querySelectorAll('#basic input').forEach(x=>cfg[x.dataset.k]=x.dataset.k==='langSeconds'?+x.value:x.value);localStorage.setItem('nanahamaLCD',JSON.stringify(cfg));alert('保存しました')};reset.onclick=()=>{if(confirm('初期値に戻しますか？')){localStorage.removeItem('nanahamaLCD');location.reload()}};
</script></body></html>
